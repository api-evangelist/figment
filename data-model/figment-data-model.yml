description: >-
  Entity-relationship view of the Figment API, derived from the 55 schemas and 129 operations in the
  published OpenAPI 3.1.0 plus the path/id-field references between them. Figment's model is
  protocol-partitioned rather than centrally normalized: the same conceptual entity (a stake, a
  reward, an activity) is expressed by protocol-specific schemas and paths. The one genuinely shared
  spine is the ORGANIZATION implied by the API key — every list endpoint is implicitly scoped to
  "the authenticated organization" and there is no organization resource in the API.
