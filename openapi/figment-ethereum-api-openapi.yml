openapi: 3.2.0
info:
  title: Figment Ethereum API
  version: 2.0.0+1190.1
  termsOfService: https://figment.io/staking-terms-of-use
servers:
- url: https://api.figment.io
tags:
- name: Ethereum
paths:
  /ethereum/validators:
    post:
      summary: Create Validators
      tags:
      - Ethereum
      operationId: create-validators
      parameters: []
      responses:
        '201':
          description: Created validators
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/validator_provision_response'
                  meta:
                    $ref: '#/components/schemas/validators_create_meta'
                example:
                  data:
                  - network: hoodi
                    pubkey: '0x8fc7b098767d6b45f431ac820f6884f6f74bbebee4e6f30456bbcf48a280248307a8260f2913a27c076f2f0c64c67aad'
                    status: provisioned
                    withdrawal_address: '0xE40F80618324C814cD444434670a44ba4583aE38'
