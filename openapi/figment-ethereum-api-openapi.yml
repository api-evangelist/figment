      responses:
        '200':
          description: List of validator withdrawals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          example: 7642977
                          description: The unique index of the withdrawal on chain (from round robin process).
                        pubkey:
                          type: string
                          example: '0x9999e34d7049e81fb48cefdfa0e671b920ea1a1a292c3596041da2698a9ed303b802806c5ffd49498413c4b97748239f'
                          description: The public key of the validator.
                        validator_index:
                          type: integer
                          example: 626955
                          description: The index of the validator.
                        withdrawal_address:
                          type: string
                          example: '0xe187d594402c8f6b147f22d443406d1b1edebdc7'
                          description: The withdrawal address of the validator.
                        amount_text:
                          type: string
                          example: '32'
                          description: The withdrawal amount (as text).
                        currency:
                          type: string
                          example: ETH
                        amount_numeric:
                          type: integer
                          example: 32000000000000000000
                          description: The withdrawal amount (as an integer) - needs exp below.
                        exp:
                          type: integer
                          example: 18
                          description: The exponent used to calculate the final ETH amount.
                        full_withdrawal:
                          type: boolean
                          example: true
                          description: Whether the validator exited or not.
                        slot:
                          type: integer
                          example: 6694928
                          description: The consensus layer slot at which the withdrawal occurred.
                        block_number:
                          type: integer
                          example: 17512592
                          description: The execution layer block at which the withdrawal occurred.
                        epoch:
                          type: integer
                          example: 209216
                          description: The epoch in which the withdrawal sweep happened.
                        timestamp:
                          type: string
                          example: '2023-06-19T08:25:36Z'
                          description: The timestamp of the end of the epoch.
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: ethereum
                        description: The name of the protocol queried.
                      network:
                        type: string
                        enum:
                        - mainnet
                        - hoodi
                        example: mainnet
                        description: Name of the network on which rewards were earned.
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewards_error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewards_error'
        '500':
          description: System error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewards_error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                  example: '2023-06-19'
                  description: Lower bound of withdrawal data expressed as epoch number (for epoch rollup only) or timestamps (as strings "YYYY-MM-DD"). This parameter is ignored when all_time rollup is requested.
                end:
                  type: string
                  example: '2023-07-19'
                  description: Upper bound of withdrawal data expressed as epoch number (for epoch rollup only) or timestamps (as strings "YYYY-MM-DD"). This parameter is ignored when all_time rollup is requested.
                network:
                  type: string
                  nullable: true
                  default: mainnet
                  enum:
                  - mainnet
                  - hoodi
                withdrawal_addresses:
                  type: array
                  description: A set of withdrawal addresses (or withdrawal credentials) to include in the results.
                  nullable: true
                  items:
                    type: string
                    example: '0xe187d594402c8f6b147f22d443406d1b1edebdc7'
                pubkeys:
                  type: array
                  description: A set of validator public keys to include in the results.
                  nullable: true
                  items:
                    type: string
                    example: '0x9999e34d7049e81fb48cefdfa0e671b920ea1a1a292c3596041da2698a9ed303b802806c5ffd49498413c4b97748239f'
              required:
              - start
              - end
  /ethereum/validators/exits:
