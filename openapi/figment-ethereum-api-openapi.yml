  /ethereum/broadcast:
    post:
      summary: Broadcast Staking Tx
      tags:
      - Ethereum
      operationId: broadcast-staking-tx
      parameters: []
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ethereum_broadcast_transaction'
                example:
                  data:
                    transaction_hash: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
                    activity:
                      type: null
                      status: pending
                      network: hoodi
                      protocol: ethereum
                      tx:
                        hash: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
                        status: in_progress
        '401':
          description: Invalid API key
        '400':
          description: Invalid params
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '422':
          description: Invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: Signed Transaction
                properties:
                  network:
                    type: string
                    example: hoodi
                    enum:
                    - mainnet
                    - hoodi
                  signed_transaction:
                    type: string
                    example: ''
                    description: The unsigned transaction, serialized with the signature. See https://docs.figment.io/v2.0/docs/signing-transactions.
                required:
                - network
                - signed_transaction
              - type: object
                title: Unsigned Transaction + Signature
                properties:
                  network:
                    type: string
                    example: hoodi
                    enum:
                    - mainnet
                    - hoodi
                  unsigned_transaction_serialized:
                    type: string
                    example: ''
                    description: The unsigned transaction received from the create validators endpoint. See https://docs.figment.io/v2.0/reference/create-validators.
                  signature:
                    type: string
                    example: '0x789a80053e4927d0a898db8e065e948f5cf086e32f9ccaa54c1908e22ac430c62621578113ddbb62d509bf6049b8fb544ab06d36f916685a2eb8e57ffadde02301'
                    description: The signature corresponding to the unsigned transaction. See https://docs.figment.io/v2.0/docs/signing-transactions. Must be prefixed with `0x`.
                required:
                - network
                - unsigned_transaction_serialized
                - signature
  /ethereum/validators_summary:
    get:
      summary: Validators Summary
      tags:
      - Ethereum
      operationId: ethereum-validators-summary
      parameters:
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      - name: operated_by
        in: query
        description: if `figment`, returns data for Figment-operated validators only
        schema:
          type: string
          enum:
          - figment
          default: null
        required: false
      responses:
        '200':
          description: Validator summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/validators_summary'
                example:
                  data:
                    validator_counts:
                      total: 100
                      by_status:
                        provisioned: 1
                        funding_requested: 1
                        deposited_not_finalized: 0
                        depoisted: 0
                        pending_initialized: 0
                        pending_queued: 0
                        active_ongoing: 94
                        active_exiting: 1
                        active_slashed: 0
                        exited_slashed: 0
                        exited_unslashed: 0
                        withdrawal_possible: 1
                        withdrawal_done: 2
        '422':
          description: Invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '400':
          description: Invalid operated_by
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Invalid API key
  /ethereum/activity:
    get:
      summary: Activity
      tags:
      - Ethereum
      operationId: ethereum-activity
      parameters:
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      - name: start
        in: query
        schema:
          type: string
        description: List activity starting at or after this time.
        example: '2024-03-12T00:00:00Z'
        required: false
      - name: end
        in: query
        schema:
          type: string
        description: List activity up to this time.
        example: '2024-03-13T00:00:00Z'
        required: false
      - name: page
        in: query
        required: false
        style: deepObject
        schema:
          type: object
          properties:
            number:
              type: integer
              example: 2
              minimum: 1
              description: The page number.
            size:
              type: integer
              example: 10
              minimum: 1
              maximum: 100
              description: Number of items to include in the response.
      - name: withdrawal_address
        in: query
        schema:
          type: string
        description: Withdrawal address for validators related to activity
        example: 0xEthereumAddress
        required: false
      responses:
        '200':
          description: List of staking/unstaking activity.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      anyOf:
                      - $ref: '#/components/schemas/staking_activity_stake'
                      - $ref: '#/components/schemas/staking_activity_unstake'
                  meta:
                    $ref: '#/components/schemas/pagination'
                example:
                  data:
                  - action: unstake
                    timestamp: '2024-03-15T14:49:01Z'
                    network: mainnet
                    currency: ETH
                    amount: 32
                    status: exiting
                  - action: stake
                    timestamp: '2024-03-13T08:02:17Z'
                    network: mainnet
                    currency: ETH
                    amount: 96
                    tx_hash: '0xef7310cc8324ce15a483d9578a5a732d203ec8f99f5b84ad8139140ea317a3fb'
                    status: activating
                  meta:
                    pagination:
                      current_page: 1
                      total_pages: 1
                      total_item_count: 2
        '422':
          description: Invalid network
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/error'
        '401':
          description: Invalid API key
  /ethereum/rewards:
    post:
      summary: Rewards
      operationId: eth-rewards
      tags:
      - Ethereum
      parameters: []
      responses:
        '200':
          description: List of rewards and balances aggregated for all addresses registered to the organization and rolled up to the requested `time_rollup`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pubkey:
                          type: string
                          description: The validator pubkey
                          example: '0x9a0059ed6c2d2e35104a5113fdefa9d06cbd855b7be170f068b100391ffc811f55af4933e5e832a6c4ccfa69e7e4d120'
                        rewards:
                          type: array
                          items:
                            type: object
                            description: rewards earned by the validator for the given period
                            properties:
                              text:
                                type: string
                                description: The textual version of the rewards in ETH
                              currency:
                                type: string
                                description: Currency of rewards textual representation. Always `ETH`
                              numeric:
                                type: integer
                                description: Numerical representation of the rewards in wei
                              exp:
                                type: integer
                                description: The exponent to use for converting numeric value to ETH. Always `18`.
                              type:
                                type: string
                                description: 'Type of the rewards: `consensus`, `execution`, or `consensus_penalty`. The `consensus_penalty` entry is only present when `include_penalties` is `true` and the validator incurred a penalty for the period.'
                              recipient:
                                type: string
                                description: Recipient of the execution rewards (tip). Only available in execution rewards for epoch/daily rollup.
                              sender:
                                type: string
                                description: Address of MEV builder that sent the execution rewards (tips) to the validator
                              slot:
                                type: integer
                                description: Slot number of the proposal made by the validator
                              block:
                                type: integer
                                description: Execution layer block number of the proposal made by the validator
                              is_mev:
                                type: boolean
                                description: Whether or not MEV boost was used for the proposal
                              mev_relay:
                                type: string
                                description: Name of the mev boost service (if proposal was mev boosted)
                              tx_hash:
                                type: string
                                description: Hash of the transaction used to send MEV boosted tips
                        balances:
                          type: array
                          items:
                            type: object
                            description: Total balance of the validator at the end of each given period.
                            properties:
                              text:
                                type: string
                                description: The textual version of the balance in ETH
                              currency:
                                type: string
                                description: Currency of balance textual representation. Always `ETH`
                              numeric:
                                type: integer
                                description: Numerical representation of the balance in wei
                              exp:
                                type: integer
                                description: The exponent to use for converting numeric value to ETH. Always `18`.
                        epoch:
                          type: integer
                          description: The Epoch number (only present when epoch time_rollup is requested).
                        timestamp:
                          type: string
                          description: The timestamp of the end of the period rewards are reported for.
                        max_epoch:
                          type: integer
                          description: The last Epoch number reported for the validator for the day (only present when daily time_rollup is requested).
                        withdrawal_credentials:
                          type: string
                          description: The withdrawal credentials of the validator entity.
                        withdrawal_address:
                          type: string
                          description: Eth1 Withdrawal address of the validator. Only available when withdrawal credentials is not a BLS.
                        started_at:
                          type: string
                          description: Timestamp of the earliest record of rewards we have indexed for the validator. Only available in all_time time_rollup requests.
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: ethereum
                        description: The name of the protocol queried.
                      network:
                        type: string
                        enum:
                        - mainnet
                        - hoodi
                        example: mainnet
                        description: The name of the network queried.
                      time_rollup:
                        type: string
                        example: daily
                        description: The time rollup unit of the rewards.
                      pagination:
                        type: object
                        description: Pagination information. Only available for all_time time_rollup and when the request supplies 'page' parameter.
                        properties:
                          total_item_count:
                            type: integer
                            description: Total number of items found.
                          total_pages:
                            type: integer
                            description: Total number of pages.
                          current_page:
                            type: integer
                            description: The current page number requested.
              examples:
                daily_rollup:
                  value:
                    data:
                    - pubkey: '0x9a0059ed6c2d2e35104a5113fdefa9d06cbd855b7be170f068b100391ffc811f55af4933e5e832a6c4ccfa69e7e4d120'
                      rewards:
                      - text: '0.002932238'
                        currency: ETH
                        numeric: 2932238000000000
                        exp: 18
                        type: consensus
                      - text: '0.019767962495220182'
