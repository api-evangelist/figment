  /ethereum/activities:
    get:
      summary: Activities
      tags:
      - Ethereum
      operationId: ethereum-activities
      description: 'Returns Ethereum staking activities for the authenticated organization.


        ## Activity types


        | `type`          | Description | Notes |

        |-----------------|-------------|-------|

        | `stake`         | ETH deposited to the deposit contract to provision a validator | |

        | `unstake`       | Validator exit initiated | `tx.hash` and `tx.status` are always `null` — the exit is an off-chain beacon chain message, not an on-chain transaction |

        | `delegation`    | Rewards compounded / top-up stake activated | |

        | `undelegation`  | Partial withdrawal swept from the beacon chain | |

        | `consolidation` | Two validators consolidated into one | |

        | `upgrade`       | Validator credentials upgraded to compounding | |


        `tx.status` reflects the on-chain transaction status (`in_progress`, `confirmed`, `failed`, `expired`).

        '
      parameters:
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - stake
          - unstake
          - delegation
          - undelegation
          - consolidation
          - upgrade
        description: Filter by activity type.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - complete
          - failed
        description: Filter by activity-life status.
      - name: address
        in: query
        schema:
          type: string
        required: false
        description: Filter to activities for a wallet address (case-insensitive). For Ethereum this is the validator withdrawal address. Matches the `delegation_address` returned on each activity.
      - name: start
        in: query
        schema:
          type: string
        required: false
        example: '2024-03-12T00:00:00Z'
      - name: end
        in: query
        schema:
          type: string
        required: false
        example: '2024-03-13T00:00:00Z'
      - name: page
        in: query
        required: false
        style: deepObject
        schema:
          type: object
          properties:
            number:
              type: integer
              example: 2
              minimum: 1
              description: The page number.
            size:
              type: integer
              example: 10
              minimum: 1
              maximum: 100
              description: Number of items to include in the response.
      responses:
        '200':
          description: List of activities, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        title: Stake
                        description: ETH deposited to the deposit contract to provision a validator.
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
                            description: Activity UUID.
                          status:
                            type: string
                            enum:
                            - pending
                            - complete
                            - failed
                            example: pending
                            description: Activity-life status (warmup/cooldown), not the on-chain status.
                          network:
                            type: string
                            enum:
                            - mainnet
                            - hoodi
                            example: hoodi
                          protocol:
                            type: string
                            example: ethereum
                          amount:
                            type: number
                            example: 32.0
                            description: Amount in the asset major unit.
                          currency:
                            type: string
                            example: ETH
                          timestamp:
                            type: string
                            example: '2024-03-12T00:00:00.000Z'
                          estimated_completed_at:
                            type:
                            - string
                            - 'null'
                            description: Estimated activity completion time, when known.
                          delegation_address:
                            type:
                            - string
                            - 'null'
                            description: The wallet that originated the activity — for Ethereum, the validator withdrawal address. Matches the `address` filter.
                          tx:
                            type: object
                            description: On-chain transaction axis. Distinct from the activity-life `status`.
                            properties:
                              hash:
                                type:
                                - string
                                - 'null'
                                example: 0x4f1a2b…
                                description: Transaction hash, when one exists.
                              status:
                                type:
                                - string
                                - 'null'
                                enum:
                                - in_progress
                                - confirmed
                                - failed
                                - expired
                                - null
                                example: confirmed
                                description: On-chain/transaction status. Null until the transaction is tracked.
                          details:
                            type: object
                            properties:
                              pubkeys:
                                type: array
                                items:
                                  type: string
                                description: Validator pubkey(s) the activity concerns.
                          type:
                            type: string
                            enum:
                            - stake
                            example: stake
                      - type: object
                        title: Unstake
                        description: Validator exit initiated. `tx.hash` and `tx.status` are always `null` — the exit is an off-chain beacon chain message, not an on-chain transaction.
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
