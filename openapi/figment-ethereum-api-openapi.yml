    validator_to_exit:
      type: object
      properties:
        id:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: A unique UUID for the validator.
        index:
          type: integer
          example: '123456'
          description: Validator's onchain index
          nullable: true
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
        pubkey:
          type: string
          example: '0xd1ef8d468ef53d82368d2026e321ab2c6d44f44c33b7b9f22369bf6dcf37fb0208f82dd6b485325ce1bbf5aec7ad45bb'
          description: The pubkey for the validator. Prefixed with `0x`.
        withdrawal_address:
          type: string
          example: '0xE40F80618324C814cD444434670a44ba4583aE38'
        status:
          type: string
          nullable: true
          example: active_ongoing
          description: The current status of the validator.
        withdrawal_credentials:
          type: string
          nullable: true
          example: '0x010000000000000000000000fc438e6cc4b230eb5bfaae1337c3f5da2b9140f1'
          description: Withdrawal credentials for the validator funds to be withdrawn upon exit.
        fee_recipient_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The fee recipient address that receives Execution Layer fees. For Figment-operated validators only.
        net_fee_payout_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The net payout address that receives the customer's share of Execution Layer fees. For Figment-operated validators only.
        region:
          type: string
          nullable: true
          example: ca-central-1
          description: The geographic region in which the validator operates. For Figment-operated validators only.
        deposit_data:
          type: object
          nullable: true
          description: Data for funding the validator.
          properties:
            amount:
              type: integer
              nullable: true
              description: An amount of ETH in GWEI required to deposit
              example: 32000000000
            signature:
              type: string
              nullable: true
              example: '0xaab7e3b41689fced6c3437a6bc5caf471ed319b94ad2642c47c5f641d5e3a046432171d47d48cd7a3e8a323939d4976c1315ad4dae134c421214673ddff9105ef1bb7f79c1babc6cd9c31428d5e44472164e9c9fccfd10fb9768c0855b194f49'
              description: A "proof of possession" which signs over pubkey, withdrawal_credentials, and amount using the validator private key.
            figment_signature:
              type: string
              nullable: true
              example: 0xZDFlZjhkNDY4ZWY1M2Q4MjM2OGQyMDI2ZTMyMWFiMmM2ZDQ0ZjQ0YzMzYjdiOWYyMjM2OWJmNmRjZjM3ZmIwMjA4ZjgyZGQ2YjQ4NTMyNWNlMWJiZjVhZWM3YWQ0NWJi
              description: A base64 encoded signature of the validator's public key, signed by a private key maintained by Figment.
            deposit_data_root:
              type: string
              nullable: true
              example: b2f5083221d6b61f2237af155c07c746f6a75c7d24dfe418106efdf87e9b9422
              description: The deposit data.
            deposit_message_root:
              type: string
              nullable: true
              example: 026cbefa013e03a3d81592b7a5f6205773c12a6f7674529e497e9a4eb2df2d44
              description: The deposit message.
            fork_version:
              type: string
              nullable: true
              example: '0x00000000'
              description: The genesis fork version.
            deposit_cli_version:
              type: string
              nullable: true
              example: 1.2.0
              description: The version of the CLI software used when making the deposit.
        status_history:
          type: object
          nullable: true
          description: Details of the status history.
          properties:
            events:
              type: array
              items:
                type: object
                properties:
                  status:
                    type: string
                    example: funding_requested
                  changed_at:
                    type: string
                    example: '2023-07-01T00:00:00.000Z'
                    description: When the status changed.
                example:
                - status: provisioned
                  changed_at: '2023-07-01T00:00:00.000Z'
                - status: funding_requested
                  changed_at: '2023-07-01T00:00:00.000Z'
                - status: deposited
                  changed_at: '2023-07-01T00:00:00.000Z'
                - status: active_ongoing
                  changed_at: '2023-07-01T00:00:00.000Z'
        status_estimates:
          type: object
          nullable: true
          description: Estimates for the validator.
          properties:
            estimated_active_at:
              type: string
              nullable: true
              example: '2023-07-01T00:00:00.000Z'
              description: Estimate of when the validator will become active and start earning rewards.
            estimated_exit_at:
              type: string
              nullable: true
              example: '2023-07-01T00:00:00.000Z'
              description: Estimate of when the validator will exit and stop earning rewards.
            estimated_withdrawal_at:
              type: string
              nullable: true
              example: '2023-07-01T00:00:00.000Z'
              description: Estimate of when the principal will be withdrawable.
        on_demand_exit:
          type: object
          nullable: true
          description: Details of the on-demand exit.
          properties:
            requested_at:
              type: string
              nullable: true
              example: '2023-07-01T00:00:00.000Z'
              description: A timestamp representing the customer request to exit this validator, either through the Figment app or Staking API.
            approved_at:
              type: string
              nullable: true
              example: null
              description: A timestamp representing the time at which the customer exit request was approved by Figment.
            submitted_at:
              type: string
              nullable: true
              example: null
              description: A timestamp representing the time at which the validator's exit transaction was submitted to Ethereum's consensus layer.
            request_id:
              type: string
              format: uuid
              nullable: true
              example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              description: The unique request ID (which may be the Staking API flow ID) used to request an exit for this validator.
        exit_message:
          type: object
          nullable: true
          description: Details of the exit message.
          properties:
            fork_version:
