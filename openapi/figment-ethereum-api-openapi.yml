                        mev_relay: Block Native
                        tx_hash: '0x25e3a03462a55b2632573cfc8e36cbb431d38793b6d26603cb11fd0251fee73b'
                      balances:
                      - text: '33.824197321'
                        currency: ETH
                        numeric: 33824197321000000000
