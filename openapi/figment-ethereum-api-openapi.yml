                    estimated_completed_at:
                      type:
                      - string
                      - 'null'
                      description: Estimated activity completion time, when known.
                    delegation_address:
                      type:
                      - string
                      - 'null'
                      description: The wallet that originated the activity — for Ethereum, the validator withdrawal address. Matches the `address` filter.
                    tx:
                      type: object
                      description: On-chain transaction axis. Distinct from the activity-life `status`.
                      properties:
                        hash:
                          type:
                          - string
                          - 'null'
                          example: 0x4f1a2b…
                          description: Transaction hash, when one exists.
                        status:
                          type:
                          - string
                          - 'null'
                          enum:
                          - in_progress
                          - confirmed
                          - failed
                          - expired
                          - null
                          example: confirmed
                          description: On-chain/transaction status. Null until the transaction is tracked.
                    details:
                      type: object
                      properties:
                        pubkeys:
                          type: array
                          items:
                            type: string
                          description: Validator pubkey(s) the activity concerns.
                    type:
                      type: string
                      enum:
                      - upgrade
                      example: upgrade
                example:
                  id: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
                  type: stake
                  status: pending
                  network: hoodi
                  protocol: ethereum
                  amount: 32.0
                  currency: ETH
                  timestamp: '2024-03-12T08:02:17Z'
                  estimated_completed_at: null
                  delegation_address: '0xabcdef1234567890abcdef1234567890abcdef12'
                  tx:
                    hash: '0xef7310cc8324ce15a483d9578a5a732d203ec8f99f5b84ad8139140ea317a3fb'
                    status: confirmed
                  details:
                    pubkeys:
                    - '0xa1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6'
        '404':
          description: Activity not found.
