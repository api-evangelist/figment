                            example: ETH
                          timestamp:
                            type: string
                            example: '2024-03-12T00:00:00.000Z'
                          estimated_completed_at:
                            type:
                            - string
                            - 'null'
                            description: Estimated activity completion time, when known.
                          delegation_address:
                            type:
                            - string
                            - 'null'
                            description: The wallet that originated the activity — for Ethereum, the validator withdrawal address. Matches the `address` filter.
                          tx:
                            type: object
                            description: On-chain transaction axis. Distinct from the activity-life `status`.
                            properties:
                              hash:
                                type:
                                - string
                                - 'null'
                                example: 0x4f1a2b…
                                description: Transaction hash, when one exists.
                              status:
                                type:
                                - string
                                - 'null'
                                enum:
                                - in_progress
                                - confirmed
                                - failed
                                - expired
                                - null
                                example: confirmed
                                description: On-chain/transaction status. Null until the transaction is tracked.
                          details:
                            type: object
                            properties:
                              pubkeys:
                                type: array
                                items:
                                  type: string
                                description: Validator pubkey(s) the activity concerns.
                          type:
                            type: string
                            enum:
                            - unstake
                            example: unstake
                      - type: object
                        title: Delegation
                        description: Rewards compounded / top-up stake activated.
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
                            description: Activity UUID.
                          status:
                            type: string
                            enum:
                            - pending
                            - complete
                            - failed
                            example: pending
                            description: Activity-life status (warmup/cooldown), not the on-chain status.
                          network:
                            type: string
                            enum:
                            - mainnet
                            - hoodi
                            example: hoodi
                          protocol:
                            type: string
                            example: ethereum
                          amount:
                            type: number
                            example: 32.0
                            description: Amount in the asset major unit.
                          currency:
                            type: string
                            example: ETH
                          timestamp:
                            type: string
                            example: '2024-03-12T00:00:00.000Z'
                          estimated_completed_at:
                            type:
                            - string
                            - 'null'
                            description: Estimated activity completion time, when known.
                          delegation_address:
                            type:
                            - string
                            - 'null'
                            description: The wallet that originated the activity — for Ethereum, the validator withdrawal address. Matches the `address` filter.
                          tx:
                            type: object
                            description: On-chain transaction axis. Distinct from the activity-life `status`.
                            properties:
                              hash:
                                type:
                                - string
                                - 'null'
                                example: 0x4f1a2b…
                                description: Transaction hash, when one exists.
                              status:
                                type:
                                - string
                                - 'null'
                                enum:
                                - in_progress
                                - confirmed
                                - failed
                                - expired
                                - null
                                example: confirmed
                                description: On-chain/transaction status. Null until the transaction is tracked.
                          details:
                            type: object
                            properties:
                              pubkeys:
                                type: array
                                items:
