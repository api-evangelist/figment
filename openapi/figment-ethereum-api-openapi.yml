              description: A pre-signed exit message encrypted with the public encryption key you've stored with Figment. See https://docs.figment.io/docs/exiting-eth-validator.
        staking_request:
          type: object
          nullable: true
          properties:
            id:
              type: string
              example: f8bd4623-39ed-46ec-8518-991792665e56
              description: The ID of the staking position.
            created_at:
              type: string
              example: '2023-07-01T00:00:00.000Z'
              description: The time at which the staking request was created.
        balances:
