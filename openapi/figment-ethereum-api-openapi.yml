        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewards_error'
        '500':
          description: System error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/rewards_error'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                time_rollup:
                  type: string
                  enum:
                  - epoch
                  - daily
                  - all_time
                  description: The granularity of the rewards data. Use `epoch` for one record per validator per epoch, `daily` for rewards aggregated by UTC calendar day, or `all_time` for cumulative rewards since validator activation.
                  example: daily
                start:
                  type: string
                  example: '2023-07-31'
                  description: 'Lower bound of rewards data. For `epoch` time_rollup: accepts an epoch number as an integer (e.g. 261702) or a date string ("YYYY-MM-DD"). For `daily` time_rollup: accepts a date string ("YYYY-MM-DD"). Ignored for `all_time` time_rollup.'
                end:
                  type: string
                  example: '2023-07-31'
                  description: 'Upper bound of rewards data. For `epoch` time_rollup: accepts an epoch number as an integer (e.g. 261703) or a date string ("YYYY-MM-DD"). For `daily` time_rollup: accepts a date string ("YYYY-MM-DD"). Ignored for `all_time` time_rollup.'
                groups:
                  type: string
                  description: Filter using comma-separated group uuids.
                  example: be982d21-ff93-4092-b56a-f40bac865400,a0ba2333-c541-41f0-ad89-e29a268a3ee5
                network:
                  type: string
                  default: mainnet
                  enum:
                  - mainnet
                  - hoodi
                pubkeys:
                  type: array
                  description: A list of validator pubkeys for filtering.
                  items:
                    type: string
                    example: '0x9a0059ed6c2d2e35104a5113fdefa9d06cbd855b7be170f068b100391ffc811f55af4933e5e832a6c4ccfa69e7e4d120'
                withdrawal_addresses:
                  type: array
                  description: A list of withdrawal addresses or credentials for filtering.
                  items:
                    type: string
                    example: '0x010000000000000000000000ed488e6cc4b030eb5bfdde3227c3d5da2b9040e8'
                page:
                  type: object
                  properties:
                    size:
                      type: integer
                      example: 500
                      description: Max number of entries to return. Only available when time_rollup is "all_time".
                    number:
                      type: integer
                      example: 1
                      description: page number of result set. Only available when time_rollup is "all_time"
                include_penalties:
                  type: boolean
                  default: false
                  description: 'When `true`, includes a separate `consensus_penalty` entry in the rewards array representing attestation and sync committee penalties for the period. Defaults to `false`.

                    **Data availability:** Penalty data is available from epoch **427295** (2026-02-12) onward. For periods before this epoch/date, no `consensus_penalty` entry will be present in the response regardless of whether penalties were incurred. For `all_time` rollups, the penalty represents the sum from epoch 427295 (2026-02-12) to present, not the validator''s full lifetime.'
              required:
              - time_rollup
              - start
              - end
