components:
  schemas:
    validator:
      type: object
      properties:
        id:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: A unique UUID for the validator.
        index:
          type: integer
          example: '123456'
          description: Validator's onchain index
          nullable: true
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
        pubkey:
          type: string
          example: '0xd1ef8d468ef53d82368d2026e321ab2c6d44f44c33b7b9f22369bf6dcf37fb0208f82dd6b485325ce1bbf5aec7ad45bb'
          description: The pubkey for the validator. Prefixed with `0x`.
        withdrawal_address:
          type: string
          example: '0xE40F80618324C814cD444434670a44ba4583aE38'
        status:
          type: string
          nullable: true
          example: funding_requested
          description: The current status of the validator.
        withdrawal_credentials:
          type: string
          nullable: true
          example: '0x010000000000000000000000fc438e6cc4b230eb5bfaae1337c3f5da2b9140f1'
          description: Withdrawal credentials for the validator funds to be withdrawn upon exit.
        fee_recipient_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The fee recipient address that receives Execution Layer fees. For Figment-operated validators only.
        net_fee_payout_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The net payout address that receives the customer's share of Execution Layer fees. For Figment-operated validators only.
        region:
          type: string
          nullable: true
          example: ca-central-1
          description: The geographic region in which the validator operates. For Figment-operated validators only.
        deposit_data:
          type: object
          nullable: true
          description: Data for funding the validator.
          properties:
            amount:
              type: integer
              nullable: true
              description: An amount of ETH in GWEI required to deposit
