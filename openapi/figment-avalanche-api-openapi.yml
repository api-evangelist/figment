openapi: 3.2.0
info:
  title: Figment Avalanche API
  version: 2.0.0+1190.1
  termsOfService: https://figment.io/staking-terms-of-use
servers:
- url: https://api.figment.io
tags:
- name: Avalanche
paths:
  /avalanche/broadcast:
    post:
      summary: Broadcasts
      tags:
      - Avalanche
      operationId: broadcast-avalanche-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transaction_hash:
                        type: string
                        example: 0xTransactionHash
                        description: Transaction Hash of the broadcasted transaction
                example:
                  type: object
                  properties:
                    network:
                      type: string
                      example: hoodi
                      enum:
                      - mainnet
                      - hoodi
                      description: Network name
                    transaction_hash:
                      type: string
                      example: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
                      description: The transaction hash from the onchain broadcast.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet or fuji
                signed_payload:
                  type: string
                  example: 0xSignedPayload
                  description: Signature from signing the signing_payload
                unsigned_transaction_serialized:
                  type: string
                  example: 0xSerializedTransaction
                  description: unsigned_transaction_serialized from the tx response
              required:
              - network
              - signed_payload
              - unsigned_transaction_serialized
  /avalanche/delegate:
    post:
      summary: Delegate
      tags:
      - Avalanche
      operationId: build-avalanche-delegate-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: fuji
                        description: Avalanche network to build transaction for, mainnet or fuji
                      signing_payload:
                        type: string
                        example: 0xSigningPayload
                        description: Hex encoded payload to sign
                      unsigned_transaction_serialized:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoding of the built transaction
                example:
                  data:
                    network: fuji
                    unsigned_transaction_serialized: ''
                    signing_payload: ''
        '422':
          description: Invalid request
        '400':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet or fuji
                from_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address
                reward_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address to send rewards to
                amount:
                  type: float
                  example: 10.0
                  description: Amount of AVAX to delegate
                start:
                  type: integer
                  example: 1739568789
                  description: Unix timestamp of when to start delegating
                end:
                  type: integer
                  example: 1739658796
                  description: Unix Timestamp of when to end delegation
                node_id:
                  type: string
                  example: NodeID-41cr9VeX852rtHrELWnHthUV4Bbm75WBY
                  description: NodeId of Validator to delegate to
              required:
              - network
              - from_address
              - amount
              - start
              - end
              - node_id
  /avalanche/export:
    post:
      summary: Export
      tags:
      - Avalanche
      operationId: build-avalanche-export-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: fuji
                        description: Avalanche network to build transaction for, mainnet or fuji
                      signing_payload:
                        type: string
                        example: 0xSigningPayload
                        description: Hex encoded payload to sign
                      unsigned_transaction_serialized:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoding of the built transaction
                example:
                  data:
                    network: fuji
                    unsigned_transaction_serialized: ''
                    signing_payload: ''
        '422':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet or fuji
                from_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain or C-Chain address
                to_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain or C-Chain address
                amount:
                  type: float
                  example: 10.0
                  description: Amount of AVAX to delegate
              required:
              - network
              - from_address
              - to_address
              - amount
        required: true
  /avalanche/import:
    post:
      summary: Import
      tags:
      - Avalanche
      operationId: build-avalanche-import-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: fuji
                        description: Avalanche network to build transaction for, mainnet or fuji
                      signing_payload:
                        type: string
                        example: 0xSigningPayload
                        description: Hex encoded payload to sign
                      unsigned_transaction_serialized:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoding of the built transaction
                example:
                  data:
                    network: fuji
                    unsigned_transaction_serialized: ''
                    signing_payload: ''
        '422':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet or fuji
                from_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain or C-Chain address
                to_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain or C-Chain address
              required:
              - network
              - from_address
              - to_address
        required: true
  /avalanche/self_bond:
    post:
      summary: Self Bond
      tags:
      - Avalanche
      operationId: build-avalanche-self-bond-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: fuji
                        description: Avalanche network to build transaction for, mainnet or fuji
                      signing_payload:
                        type: string
                        example: 0xSigningPayload
                        description: Hex encoded payload to sign
                      unsigned_transaction_serialized:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoding of the built transaction
                example:
                  data:
                    network: fuji
                    unsigned_transaction_serialized: ''
                    signing_payload: ''
        '422':
          description: Invalid request
        '400':
          description: Invalid request format or validation errors
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet or fuji
                from_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address
                delegator_rewards_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address to send delegator rewards to
                reward_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address to send validator rewards to
                amount:
                  type: float
                  example: 10.0
                  description: Amount of AVAX to self-bond
                start:
                  type: integer
                  example: 1739568789
                  description: Unix timestamp of when the node can accept delegations
                end:
                  type: integer
                  example: 1739658796
                  description: Unix timestamp of when the node expires and will require another self-bond
                node_id:
                  type: string
                  example: NodeID-41cr9VeX852rtHrELWnHthUV4Bbm75WBY
                  description: NodeId of Validator to self-bond to
                bls_public_key:
                  type: string
                  example: '0xb8a89a87149cebd30a9da3d45dc8618389babcbda39c3d295a73d3a42b5b6f2d9c48e9875782052b61a7ded8b42b0568'
                  description: BLS public key of Validator
                bls_proof_of_possession:
                  type: string
                  example: '0x91bbaf766e386a3c93bcbb08c00dff9b0cef510f7999c68f45d4eee1c8b40c507f369a676ae7b0b880ff6f1f2df6b4ed096722ed2b675ea7e4c65a8b92961f646fe9f5b1feb018f548fa572e1bb660825377857af5750bf73ca98bda5696c752'
                  description: BLS proof of possession of Validator
                delegation_fee:
                  type: integer
                  example: 10
                  description: Delegation fee as a percentage between 2 and 100
              required:
              - network
              - from_address
              - amount
              - start
              - end
              - node_id
              - bls_public_key
              - bls_proof_of_possession
              - delegation_fee
        required: true
x-readme:
  explorer-enabled: false
  proxy-enabled: false
  headers:
  - key: x-api-key
    value: your-api-key-here
