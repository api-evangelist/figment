    PaymentPayload:
      type: object
      properties:
        x402Version:
          type: number
          enum:
          - 2
        resource:
          type: object
          properties:
            url:
              type: string
              minLength: 1
            description:
              type: string
            mimeType:
              type: string
            serviceName:
              type: string
              minLength: 1
              maxLength: 32
              pattern: "^[\\x20-\\x7e]+$"
            tags:
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 32
                pattern: "^[\\x20-\\x7e]+$"
              maxItems: 5
            iconUrl:
              type: string
              maxLength: 2048
          required:
          - url
        accepted:
          type: object
          properties:
            scheme:
              type: string
              minLength: 1
            network:
              type: string
              minLength: 3
            amount:
              type: string
              minLength: 1
            asset:
              type: string
              minLength: 1
            payTo:
              type: string
              minLength: 1
            maxTimeoutSeconds:
              type: number
              exclusiveMinimum: 0
            extra:
              type:
              - object
              - 'null'
              additionalProperties: {}
          required:
          - scheme
          - network
          - amount
          - asset
          - payTo
          - maxTimeoutSeconds
        payload:
          type: object
          additionalProperties: {}
        extensions:
          type:
          - object
          - 'null'
          additionalProperties: {}
      required:
      - x402Version
      - accepted
      - payload
      description: x402 V2 payment payload envelope. The inner `payload` field is
        scheme-specific; see the examples for each supported (scheme, network) combination.
      example:
        x402Version: 2
        resource:
          url: https://example.com/protected-resource
          description: Example protected resource being paid for.
        accepted:
          scheme: exact
          network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
          amount: '1000000'
          asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
          payTo: MerchantAddr11111111111111111111111111111111
          maxTimeoutSeconds: 120
          extra:
            feePayer: FacilitatorSigner1111111111111111111111111
        payload:
          transaction: AQAB...base64-encoded-partially-signed-solana-tx...
    PaymentRequirements:
      type: object
      properties:
        scheme:
          type: string
          minLength: 1
        network:
          type: string
          minLength: 3
        amount:
          type: string
          minLength: 1
        asset:
          type: string
          minLength: 1
        payTo:
          type: string
          minLength: 1
        maxTimeoutSeconds:
          type: number
          exclusiveMinimum: 0
        extra:
          type:
          - object
          - 'null'
          additionalProperties: {}
      required:
      - scheme
      - network
      - amount
      - asset
      - payTo
      - maxTimeoutSeconds
      description: x402 V2 payment requirements envelope. The `extra` field is scheme-specific;
        see the examples for each supported (scheme, network) combination.
      example:
        scheme: exact
        network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
        amount: '1000000'
        asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
