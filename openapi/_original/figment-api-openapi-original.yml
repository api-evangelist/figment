  "/x402/verify":
    post:
      summary: Verify
      description: Protocol-level rejections return HTTP 200 with `{isValid:false}`.
        Only malformed envelopes return 4xx. Scheme-specific payload shape is enforced
        by the registered scheme, not at the HTTP layer.
      tags:
      - x402
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProtocolBody"
            examples:
              svm-exact:
                summary: Solana, `exact` scheme
                value:
                  x402Version: 2
                  paymentPayload:
                    x402Version: 2
                    resource:
                      url: https://example.com/protected-resource
                      description: Example protected resource being paid for.
                    accepted:
                      scheme: exact
                      network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
                      amount: '1000000'
                      asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      payTo: MerchantAddr11111111111111111111111111111111
                      maxTimeoutSeconds: 120
                      extra:
                        feePayer: FacilitatorSigner1111111111111111111111111
                    payload:
                      transaction: AQAB...base64-encoded-partially-signed-solana-tx...
                  paymentRequirements:
                    scheme: exact
                    network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
                    amount: '1000000'
                    asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    payTo: MerchantAddr11111111111111111111111111111111
                    maxTimeoutSeconds: 120
                    extra:
                      feePayer: FacilitatorSigner1111111111111111111111111
      responses:
        '200':
          description: Verification result (valid or invalid).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/VerifyResponse"
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FigmentError"
  "/x402/settle":
    post:
      summary: Settle
      description: Screens payer + payee, reserves a dedup key, broadcasts the transaction,
        and records the settlement. Protocol-level failures return HTTP 200 with `{success:false,
        errorReason}`.
      tags:
      - x402
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProtocolBody"
            examples:
              svm-exact:
                summary: Solana, `exact` scheme
                value:
                  x402Version: 2
                  paymentPayload:
                    x402Version: 2
                    resource:
                      url: https://example.com/protected-resource
                      description: Example protected resource being paid for.
                    accepted:
                      scheme: exact
                      network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
                      amount: '1000000'
                      asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                      payTo: MerchantAddr11111111111111111111111111111111
                      maxTimeoutSeconds: 120
                      extra:
                        feePayer: FacilitatorSigner1111111111111111111111111
                    payload:
                      transaction: AQAB...base64-encoded-partially-signed-solana-tx...
                  paymentRequirements:
                    scheme: exact
                    network: solana:EtWTRABZaYq6iMfeYKouRu166VU2xqa1
                    amount: '1000000'
                    asset: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
                    payTo: MerchantAddr11111111111111111111111111111111
                    maxTimeoutSeconds: 120
                    extra:
                      feePayer: FacilitatorSigner1111111111111111111111111
      responses:
        '200':
          description: Settlement result (success or protocol-level failure).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettleResponse"
        '400':
          description: Malformed request body.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FigmentError"
  "/x402/partner_analytics":
    get:
      summary: Partner Analytics
      description: Returns settlement counts and USDC volume grouped by merchant +
        endpoint for the partner org identified. This is a Figment-added endpoint,
        so responses use the `{data, meta}` envelope, not a bare protocol body.
      tags:
      - x402
      parameters:
      - schema:
          type: string
          enum:
          - 1d
          - 7d
          - 30d
          - 90d
          description: Lookback window. Defaults to `7d`.
          example: 7d
        required: false
        name: range
        in: query
      - schema:
          type: string
          description: Required. CAIP-2 network filter, or the alias solana-mainnet
            / solana-devnet.
          example: solana-mainnet
        required: true
        name: network
        in: query
      responses:
        '200':
          description: Usage rows for the partner, newest window first.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PartnerAnalyticsResponse"
        '400':
          description: Unsupported `range` value, or missing/invalid `network`.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FigmentError"
        '403':
          description: Missing or malformed tenant header (staging/production).
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FigmentError"
  "/x402/settlement_reports":
    get:
      summary: Settlement Reports
      description: Pull your organization's settled payments as a daily rollup, grouped
        by buyer, merchant address, network, and token.
      tags:
      - x402
      parameters:
      - schema:
          type: string
          description: YYYY-MM-DD, inclusive. Defaults to 60 days before today. Must
            not be more than 60 days before today.
          example: '2026-05-10'
        required: false
        name: start_date
        in: query
      - schema:
          type: string
          description: YYYY-MM-DD, inclusive. Defaults to today (UTC).
          example: '2026-07-09'
        required: false
        name: end_date
        in: query
      - schema:
          type: string
          description: Your own comma-separated merchant wallet addresses.
          example: 3fX8pQeWvG816bUx9EPjHmaT23yvVM2ZWbrrpZb9Pus
        required: false
        name: merchant_addresses
        in: query
      - schema:
          type: string
          description: CAIP-2 network filter, or the alias solana-mainnet / solana-devnet.
          example: solana-mainnet
        required: false
        name: network
        in: query
      - schema:
          type: string
          description: Payment token ticker, e.g. USDC.
          example: USDC
        required: false
        name: token
        in: query
      responses:
        '200':
          description: Daily settlement rollup rows for the tenant, newest day first.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/SettlementReportResponse"
        '400':
          description: Invalid date, network, or token filter.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FigmentError"
servers:
- url: https://api.figment.io
components:
  schemas:
    broadcast_transaction:
      type: object
      properties:
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
          description: Network name
        transaction_hash:
          type: string
          example: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
          description: The transaction hash from the onchain broadcast.
    ethereum_broadcast_transaction:
      type: object
      properties:
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
          description: Network name
        transaction_hash:
          type: string
          example: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
          description: The transaction hash from the onchain broadcast.
        activity:
          type:
          - object
          - 'null'
          description: The staking activity recorded for this broadcast. Typed (stake/delegation/consolidation/undelegation)
            when the transaction is a recognized staking action; `type` is null otherwise.
          properties:
            id:
              type: string
              format: uuid
              example: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
              description: Activity UUID.
            type:
              type:
              - string
              - 'null'
              enum:
              - stake
              - delegation
              - consolidation
              - undelegation
              - unstake
              - upgrade
              -
              example: stake
              description: Activity type, or null when the transaction was not a recognized
                staking action.
            status:
              type: string
              enum:
              - pending
              - complete
              - failed
              example: pending
              description: Activity-life status.
            network:
              type: string
              enum:
              - mainnet
              - hoodi
              example: hoodi
            protocol:
              type: string
              example: ethereum
            amount:
              type: number
              example: 32.0
              description: Amount in the asset major unit.
            currency:
              type:
              - string
              - 'null'
              example: ETH
            timestamp:
              type:
              - string
              - 'null'
              example: '2024-03-12T00:00:00.000Z'
            estimated_completed_at:
              type:
              - string
              - 'null'
            delegation_address:
              type:
              - string
              - 'null'
            tx:
              type: object
              description: On-chain transaction axis. Distinct from the activity-life
                `status`.
              properties:
                hash:
                  type:
                  - string
                  - 'null'
                  example: 0xae96cb…
                status:
                  type:
                  - string
                  - 'null'
                  enum:
                  - in_progress
                  - confirmed
                  - failed
                  - expired
                  -
                  example: in_progress
            details:
              type:
              - object
              - 'null'
    broadcast_exit_message:
      type: object
      properties:
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
          description: Network name
        epoch:
          type: string
          example: '182738'
          description: Epoch as stated in the PSET
        validator_index:
          type: string
          example: '483128'
          description: The validator's index as stated in the PSET
        signature:
          type: string
          example: '0x97f0dde45b0be31fd9a76a60a25216c7b7a14f6fd21a8232cdd8cba8c419c0a618589e98ff8b8a253c9975adc11746de0f34a4d223c7927b8547d19035aeaa48f980e8e510e5278b6a901665aa24d6c54d332d39924ba3d263861a5f1fc3234d'
          description: Signature as stated in the PSET
    nomination_proxy:
      type: object
      properties:
        stash_account_address:
          type: string
          example: 5CUwmRuV8e5yV15eaktTwW4AMkBnf2anJvehKNq9ZugXBvUh
          description: A valid Polkadot address.
        controller_account_address:
          type: string
          example: 5FH7R79Ph88uC4xJaWv3UXRxVrYVfuRPcPuQiiRJ5B8zKbCd
          description: A valid Polkadot address.
        proxy_account_address:
          type: string
          example: 5CDTPiGKvMFikx83G5vZz6jQMt7EokMDpkZ5ErSvG6ea27SS
          description: A valid Polkadot address.
        qtx_dot_bonded:
          type: string
          example: '10'
          description: An amount in DOT
        network:
          type: string
          example: polkadot
          enum:
          - polkadot
          - westend
      required:
      - stash_account_address
      - controller_account_address
      - proxy_account_address
      - qtx_dot_bonded
      - network
    revoke_proxy:
      type: object
      properties:
        stash_account_address:
          type: string
          example: 5CUwmRuV8e5yV15eaktTwW4AMkBnf2anJvehKNq9ZugXBvUh
          description: A valid Polkadot address.
        controller_account_address:
          type: string
          example: 5FH7R79Ph88uC4xJaWv3UXRxVrYVfuRPcPuQiiRJ5B8zKbCd
          description: A valid Polkadot address.
        network:
          type: string
          example: polkadot
          enum:
          - polkadot
          - westend
      required:
      - stash_account_address
      - controller_account_address
      - network
    validator:
      type: object
      properties:
        id:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: A unique UUID for the validator.
        index:
          type: integer
          example: '123456'
          description: Validator's onchain index
          nullable: true
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
        pubkey:
          type: string
          example: '0xd1ef8d468ef53d82368d2026e321ab2c6d44f44c33b7b9f22369bf6dcf37fb0208f82dd6b485325ce1bbf5aec7ad45bb'
          description: The pubkey for the validator. Prefixed with `0x`.
        withdrawal_address:
          type: string
          example: '0xE40F80618324C814cD444434670a44ba4583aE38'
        status:
          type: string
          nullable: true
          example: funding_requested
          description: The current status of the validator.
        withdrawal_credentials:
          type: string
          nullable: true
          example: '0x010000000000000000000000fc438e6cc4b230eb5bfaae1337c3f5da2b9140f1'
          description: Withdrawal credentials for the validator funds to be withdrawn
            upon exit.
        fee_recipient_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The fee recipient address that receives Execution Layer fees.
            For Figment-operated validators only.
        net_fee_payout_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The net payout address that receives the customer's share of
            Execution Layer fees. For Figment-operated validators only.
        region:
          type: string
          nullable: true
          example: ca-central-1
          description: The geographic region in which the validator operates. For
            Figment-operated validators only.
        deposit_data:
          type: object
          nullable: true
          description: Data for funding the validator.
          properties:
            amount:
              type: integer
              nullable: true
              description: An amount of ETH in GWEI required to deposit
              example: 32000000000
            signature:
              type: string
              nullable: true
              example: '0xaab7e3b41689fced6c3437a6bc5caf471ed319b94ad2642c47c5f641d5e3a046432171d47d48cd7a3e8a323939d4976c1315ad4dae134c421214673ddff9105ef1bb7f79c1babc6cd9c31428d5e44472164e9c9fccfd10fb9768c0855b194f49'
              description: A "proof of possession" which signs over pubkey, withdrawal_credentials,
                and amount using the validator private key.
            figment_signature:
              type: string
              nullable: true
              example: 0xZDFlZjhkNDY4ZWY1M2Q4MjM2OGQyMDI2ZTMyMWFiMmM2ZDQ0ZjQ0YzMzYjdiOWYyMjM2OWJmNmRjZjM3ZmIwMjA4ZjgyZGQ2YjQ4NTMyNWNlMWJiZjVhZWM3YWQ0NWJi
              description: A base64 encoded signature of the validator's public key,
                signed by a private key maintained by Figment.
            deposit_data_root:
              type: string
              nullable: true
              example: b2f5083221d6b61f2237af155c07c746f6a75c7d24dfe418106efdf87e9b9422
              description: The deposit data.
            deposit_message_root:
              type: string
              nullable: true
              example: 026cbefa013e03a3d81592b7a5f6205773c12a6f7674529e497e9a4eb2df2d44
              description: The deposit message.
            fork_version:
              type: string
