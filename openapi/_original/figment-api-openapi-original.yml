                        type: string
                        nullable: true
                        example: GNP8nFAjKFBxL6Bfmti9gBGxCRF7gMaGmEiKfJKpJAaG
                        description: The nonce value used as the transaction's blockhash.
                          Present when nonce_account is provided.
                      is_durable_nonce:
                        type: boolean
                        nullable: true
                        description: True when a durable nonce is used. last_valid_block_height
                          will be null.
