                              currency:
                                type: string
                                example: ADA
                                description: Currency of the reward
                              numeric:
                                type: integer
                                example: 1000000
                                description: Numerical representation of reward in
                                  Lovelace
                              type:
                                type: string
                                enum:
                                - member
                                - leader
                                example: member
                                description: Type of reward
                              exp:
                                type: integer
                                example: 6
                                description: The exponent to use for converting numeric
                                  value to ADA
                        balances:
                          type: array
                          description: Account balances
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                                example: '1000.0'
                                description: Formatted balance amount as string in
                                  ADA
                              currency:
                                type: string
                                example: ADA
                                description: Currency of the balance
                              numeric:
                                type: integer
                                example: 1000000
                                description: Numerical representation of balance in
                                  Lovelace
                              exp:
                                type: integer
                                example: 6
                                description: The exponent to use for converting numeric
                                  value to ADA
                  meta:
                    type: object
                    properties:
                      network:
                        type: string
                        example: mainnet
                        description: Network where rewards occurred
                      time_rollup:
                        type: string
                        example: epoch
                        description: Time aggregation level
        '400':
          description: Bad Request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type:
                  - string
