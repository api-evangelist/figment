  "/solana/activities":
    get:
      summary: Activities
      tags:
      - Solana
      operationId: solana-activities
      description: |
        Returns Solana staking activities for the authenticated organization.

        ## Activity types

        | `type`         | Description |
        |----------------|-------------|
        | `delegation`   | Stake account delegated to a validator |
        | `undelegation` | Stake account deactivated and removed from validator |
        | `withdrawal`   | SOL withdrawn back to wallet after cooldown |

        All Solana activities are on-chain. `tx.status` reflects the transaction status
        (`in_progress`, `confirmed`, `failed`, `expired`).
      parameters:
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - testnet
          - devnet
        example: mainnet
        required: true
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - delegation
          - undelegation
          - withdrawal
        description: Filter by activity type.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - pending
          - complete
          - failed
        description: Filter by activity-life status.
      - name: page
        in: query
        required: false
        style: deepObject
        schema:
          type: object
          properties:
            number:
              type: integer
              example: 2
              minimum: 1
              description: The page number.
            size:
              type: integer
              example: 10
              minimum: 1
              maximum: 100
              description: Number of items to include in the response.
      responses:
        '200':
          description: List of activities, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        title: Delegation
                        description: Stake account delegated to a validator.
                        properties:
                          id:
                            type: string
                            format: uuid
                            example: 3f1c9b2a-8e4d-4a6b-9c1e-2d5f7a8b0c3d
                            description: Activity UUID.
                          status:
                            type: string
                            enum:
                            - pending
                            - complete
                            - failed
                            example: pending
                            description: Activity-life status (warmup/cooldown), not
                              the on-chain status.
                          network:
                            type: string
                            enum:
                            - mainnet
                            - testnet
                            - devnet
                            example: mainnet
                          protocol:
                            type: string
                            example: solana
                          amount:
                            type: number
                            example: 1.0
                            description: Amount in the asset major unit.
                          currency:
                            type: string
                            example: SOL
