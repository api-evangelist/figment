  "/opentrade/{vault_address}/apr":
    get:
      summary: Annual Percentage Rate
      tags:
      - Stablecoins
      operationId: opentrade-apr
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
        description: The vault address to get APR for
        example: '0xe1b1252652A2FF0CC3A4214eE73d9FeD1FEa5b4f'
        required: true
      - name: avg
        in: query
        schema:
          type: string
          enum:
          - 30d
          - 90d
          - ytd
          default: 30d
        description: 'The yield period: 30d (30-day trailing), 90d (90-day trailing),
          ytd (year-to-date). Defaults to 30d.'
        example: 30d
        required: false
      - name: decimal
        in: query
        schema:
          type: integer
          default: 2
        description: Number of decimal places in the value (2–5). Defaults to 2.
        example: 2
        required: false
      responses:
        '401':
          description: Invalid API key
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          description: Date of the yield metrics
                        value:
                          type: string
                          description: Annualized simple yield for the chosen period
                example:
                  data:
                  - date: '2026-03-30'
                    value: '5.53'
  "/polkadot/rewards":
    post:
      summary: DOT Rewards
      tags:
      - Polkadot
      operationId: polkadot-rewards
      description: Returns Polkadot rewards for the given stash accounts and time
        range.
      parameters: []
      responses:
        '200':
          description: A rewards result set with metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        stash_account:
                          type: string
                          example: 13GzuCvjeTPi8EESc5HxgSqrzFgwiGEgSPt6q3HgU5UT4vZo
                          description: Returns the stash account or validator that
                            received the rewards.
                        validator:
                          type: string
                          example: 138QdRbUTB9eNY94Q4Mj5r39FkgMiyHCAy8UFMNA5gvtrfSB
                          description: The validator that distributed the rewards
                        era:
                          type: string
                          example: '845'
                          description: The era number.
                        active_era:
                          type: integer
                        timestamp:
                          type: string
                          example: '2023-07-21T00:00:00Z'
                          description: The timestamp of the end of the era.
                        rewards:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                                description: The textual version of the other fields
                                  in the rewards object.
                                example: '3.6694634053'
                              currency:
                                type: string
                                description: Currency code (e.g. DOT)
                                example: DOT
                              numeric:
                                type: integer
                                description: Raw reward amount in planck (smallest
                                  unit)
                                example: 36694634053
                              exp:
                                type: integer
                                description: Subunit exponent
                                example: 10
                            description: The formula to compute the final rewards
                              in the currency unit is numeric x 10^(-exp).
                        balances:
                          type: array
                          items:
                            type: object
                            properties:
                              text:
                                type: string
                                description: The textual version of the other fields
                                  in the rewards object.
                                example: '211509.8626318288'
                              currency:
                                type: string
                                description: Currency code (e.g. DOT)
                                example: DOT
                              numeric:
                                type: integer
                                description: Raw account balance in planck (smallest
                                  unit)
                                example: 211509.8626318288
                              exp:
                                type: integer
                                description: Subunit exponent
                                example: 10
                            description: The account's staked balance to the validator.
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: polkadot
                        description: The name of the protocol queried.
                      network:
                        type: string
                        example: mainnet
                        description: The name of the network queried.
                      time_rollup:
                        type: string
                        example: era
                        description: The unit of the rollup.
        '422':
          description: Unprocessable Entity
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                stash_accounts:
                  type: array
                  items:
                    type: string
                    example: 12m7XtVWZQuxTirqtzm2dm5J4r16vSQruPmahThMnskG8Bcp
                  description: Stash accounts addresses.
                start:
                  type: integer
                  description: Either era (number) or timestamps (strings formatted
                    like "YYYY-MM-DD").
                  example: 1115
                end:
                  type: integer
                  description: Either era (number) or timestamps (strings formatted
                    like "YYYY-MM-DD").
                  example: 1145
                time_rollup:
                  type: string
                  enum:
                  - era
                  - daily
                  default: era
                  description: Aggregation unit
              required:
              - stash_accounts
              - start
              - end
        required: true
