                          hours:
                            type: integer
                            example: 30
                          history:
                            type: object
                            additionalProperties:
                              type: integer
                        required:
                        - hours
                      exit_estimate:
                        type: object
                        properties:
                          hours:
                            type: integer
                            example: 42
                        required:
                        - hours
                      withdrawal_estimate:
                        type: object
                        properties:
                          hours_min:
                            type: integer
                            example: 5
                          hours_max:
                            type: integer
                            example: 27
                          history:
                            type: object
                            additionalProperties:
                              type: object
                              properties:
                                hours_min:
                                  type: integer
                                hours_max:
                                  type: integer
                        required:
                        - hours_min
                        - hours_max
