  "/cardano/rewards":
    post:
      summary: ADA Rewards
      operationId: ada-rewards
      tags:
      - Cardano
      parameters: []
      responses:
        '200':
          description: A rewards result set with metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        delegator_addresses:
                          type: string
                          example: stake1uxcmc9r2t7cxs0zw8qm8ztg3twvxryzghsc8eszek6kuwms23gya4
                          description: The delegator address that received the reward.
                        validator:
                          type: string
                          example: pool1fqwnqk3phwa2s5thgym8dw34pv0z67m526uqprnjh93cvzxymef
                          description: The address of the validator which distributed
                            the rewards
                        epoch:
                          type: string
                          example: '417'
                          description: The epoch number
                        timestamp:
                          type: string
                          example: '2023-07-21T00:00:00Z'
                          description: The timestamp of the end of the epoch
                        rewards:
                          type: array
                          items:
                            type: object
                            description: The formula to compute the final rewards
                              in the currency unit is numeric x 10^(-exp). It also
                              includes a type field which can be either member or
                              leader.
                            properties:
                              text:
                                type: string
                                example: 823.370257 ADA
                                description: The textual version of the other fields
                                  in the rewards object.
                              currency:
                                type: string
                                example: ADA
                              numeric:
                                type: integer
                                example: 823370257
                              exp:
                                type: integer
                                example: 6
                              type:
                                type: string
                                enum:
                                - member
                                - leader
                                example: member
                        balances:
                          type: array
                          items:
                            type: object
                            description: The account's staked balance to the pool
                              for the epoch.
                            properties:
                              text:
                                type: string
                                example: '0'
                                description: The textual version of the other fields
                                  in the balances object.
                              currency:
                                type: string
                                example: ADA
                              numeric:
                                type: integer
                                example: 0
                              exp:
                                type: integer
                                example: 6
                        stake_key_hash:
                          type: string
                          description: The stake key hash portion of the stake address.
                            This is the bech32 decoded stake address with the first
                            byte stripped and then hex encoded. It’s a common alternative
                            way to search for a stake address.
                          example: b1bc146a5fb0683c4e3836712d115b98619048bc307cc059b6adc76e
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: cardano
                        description: The name of the protocol queried.
                      network:
                        type: string
                        example: mainnet
                        description: The name of the network queried.
                      time_rollup:
                        type: string
                        example: epoch
                        description: The time rollup unit of the rewards.
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delegator_addresses:
                  type: array
                  description: Delegator address for which to fetch rewards
                  items:
                    type: string
                    example: stake1uxcmc9r2t7cxs0zw8qm8ztg3twvxryzghsc8eszek6kuwms23gya4
                start:
                  type: string
                  example: '2023-07-20'
                  description: Epoch numbers (as integers) or timestamps (as strings
                    "YYYY-MM-DD")
                end:
                  type: string
                  example: '2023-07-21'
                  description: Epoch numbers (as integers) or timestamps (as strings
                    "YYYY-MM-DD")
              required:
              - delegator_addresses
              - start
              - end
