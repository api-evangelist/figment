        '400':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet
                    or fuji
                from_address:
                  type: string
                  example: P-fuji1gp5r7y84ulzgq9ptkdx2rua02udym6e9f9u3ac
                  description: P-Chain address
