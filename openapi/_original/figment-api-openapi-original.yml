    get:
      tags:
      - Polkadot
      summary: DOT Reward Rates
      operationId: polkadot-rewards-rates
      parameters:
      - in: query
        name: figment
        schema:
          type: boolean
          default: false
        required: false
        description: If true is passed, we will return the reward rate for Figment
          validators only. If omitted or any other value is passed, we will return
          the reward rate of the network as a whole.
      - in: query
        name: avg
        schema:
          type: string
          enum:
          - 7d
          default: 7d
        required: false
        description: Returns the 7 day moving average. The only value accepted is
          7d, if no value is passed, the original behavior of returning a single day
          average ARR is used.
      - in: query
        name: decimal
        schema:
          type: integer
          default: 2
        required: false
        description: Adds decimal places to the returned values. Accepts values 2,
          3, 4, 5. If nothing is passed, it will default to 2.
      responses:
        '200':
          description: Rewards rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2023-07-05'
                          description: Specific date associated with value (staking
                            reward rates).
                        value:
                          type: string
                          example: '11.03'
                          description: Staking reward rates, in %.
              example:
                data:
                - date: '2023-08-29'
                  value: '10.26'
                - date: '2023-08-28'
                  value: '10.37'
                - date: '2023-08-27'
                  value: '10.37'
                - date: '2023-08-26'
                  value: '10.37'
                - date: '2023-08-25'
                  value: '10.26'
                - date: '2023-08-24'
                  value: '10.26'
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
  "/polygon/rewards":
    post:
      summary: MATIC Rewards
      operationId: matic-rewards
      tags:
      - Polygon
      parameters: []
      responses:
        '200':
          description: A rewards result set with metadata.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        delegator_address:
                          type: string
                          example: '0xA722e1F10Bc95c102251A13c2bbCB61A67257003'
                          description: The account that received the reward. This
                            is a checksummed ethereum address including lower case
                            and capital letters.
                        validator:
                          type: string
                          example: '0xF9e9b98dd99114C6C1B5C28Ae101849880E9542f'
                          description: The "owner address" of the validator which
                            distributed the rewards.
                        checkpoint:
                          type: string
                          example: '45500'
                          description: The checkpoint number.
                        timestamp:
                          type: string
                          example: '2023-07-21T00:00:00Z'
                          description: The timestamp of the end of the checkpoint.
                        rewards:
                          type: array
                          items:
                            type: object
                            description: The formula to compute the final rewards
                              in the currency unit is numeric x 10^(-exp).
                            properties:
                              text:
                                type: string
                                example: '0.000817335418355351'
                                description: The textual version of the other fields
                                  in the rewards object.
                              currency:
                                type: string
                                example: MATIC
                              numeric:
                                type: integer
                                example: 817335418355351
                              exp:
                                type: integer
                                example: 18
                        balances:
                          type: array
                          items:
                            type: object
                            description: The account's current balance.
                            properties:
                              text:
                                type: string
                                example: '302.56'
                                description: The textual version of the other fields
                                  in the balances object.
                              currency:
                                type: string
                                example: MATIC
                              numeric:
                                type: integer
                                example: 302560000000000000000
                              exp:
                                type: integer
                                example: 18
                                description: The exponent used to calculate the final
                                  MATIC amount.
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: polygon
                        description: The name of the protocol queried.
                      network:
                        type: string
                        example: mainnet
                        description: The name of the network queried.
                      time_rollup:
                        type: string
                        example: checkpoint
                        description: The unit of the period.
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delegator_addresses:
                  type: array
                  description: Delegator addresses.
                  items:
                    type: string
                    example: '0xA722e1F10Bc95c102251A13c2bbCB61A67257003'
                start:
                  type: integer
                  example: 45500
                  description: Either checkpoint (number) or timestamps (strings formatted
                    like "YYYY-MM-DD").
                end:
                  type: integer
                  example: 45501
                  description: Either checkpoint (number) or timestamps (strings formatted
                    like "YYYY-MM-DD").
              required:
              - delegator_addresses
              - start
              - end
