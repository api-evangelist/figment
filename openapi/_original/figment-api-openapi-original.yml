      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                title: 0x01 Validators
                properties:
                  network:
                    type: string
                    example: hoodi
                    enum:
                    - mainnet
                    - hoodi
                    description: The network on which validators will be created.
                  validators_count:
                    type: integer
                    example: 10
                    description: The number of validators that need to be created.
                  withdrawal_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address used for the withdrawals credentials
                      of the validators. This is the address that will receive consensus
                      rewards and unstaked ETH after exiting.
                  funding_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address that holds the ETH to be staked
                      and that will sign the staking transaction. If not specified,
                      `withdrawal_address` will be used.
                  fee_recipient_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address that will receive the execution
                      layer rewards. If not specified, `withdrawal_address` will be
                      used.
                  region:
                    type: string
                    example: ca-central-1
                    description: The geographic region where the validator will be
                      created.
                    enum:
                    - ca-central-1
                    - eu-west-1
                  credentials_prefix:
                    type: string
                    example: '0x01'
                    description: Prefix to use for withdrawal_credentials. Defaults
                      to '0x01'.
                    enum:
                    - '0x01'
                required:
                - network
                - withdrawal_address
                - validators_count
              - type: object
                title: 0x02 Validators (Pectra)
                properties:
                  network:
                    type: string
                    example: hoodi
                    enum:
                    - mainnet
                    - hoodi
                    description: The network on which validators will be created.
                  amount:
                    type: integer
                    example: 64
                    description: Amount in ETH to initially deposit to the validator.
                  withdrawal_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address used for the withdrawals credentials
                      of the validators. This is the address that will receive consensus
                      rewards and unstaked ETH after exiting.
                  funding_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address that holds the ETH to be staked
                      and that will sign the staking transaction. If not specified,
                      `withdrawal_address` will be used.
                  fee_recipient_address:
                    type: string
                    example: '0xE40F80618324C814cD444434670a44ba4583aE38'
                    description: An ETH wallet address that will receive the execution
                      layer rewards. If not specified, `withdrawal_address` will be
                      used.
                  region:
                    type: string
                    example: ca-central-1
                    description: The geographic region where the validator will be
                      created.
                    enum:
                    - ca-central-1
                    - eu-west-1
                  credentials_prefix:
                    type: string
                    example: '0x01'
                    description: Prefix to use for withdrawal_credentials. Defaults
                      to '0x01'.
                    enum:
                    - '0x02'
                required:
                - network
                - withdrawal_address
                - credentials_prefix
                - amount
    get:
      summary: Get Validators
      tags:
      - Ethereum
      operationId: get-validators
      parameters:
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      - name: withdrawal_address
        in: query
        required: false
        schema:
          type: string
        description: The validator's withdrawal address. Must be prefixed with `0x`.
        example: '0xE40F80618324C814cD444434670a44ba4583aE38'
      - name: groups
        in: query
        required: false
        schema:
          type: string
        description: Filter using comma-separated group uuids.
        example: be982d21-ff93-4092-b56a-f40bac865400,a0ba2333-c541-41f0-ad89-e29a268a3ee5
      - name: region
        in: query
        schema:
          type: string
          enum:
          - ca-central-1
          - eu-west-1
        required: false
        example: ca-central-1
        description: The validator's geographic region. Only for Figment validators.
      - name: status
        in: query
        schema:
          type: string
          enum:
          - provisioned
          - funding_requested
          - deposited_not_finalized
          - deposited
          - pending_initialized
          - pending_queued
          - active_exiting
          - active_ongoing
          - active_slashed
          - exited_slashed
          - exited_unslashed
          - withdrawal_done
          - withdrawal_possible
        required: false
        example: active_ongoing
        description: The current validator's status. See https://docs.figment.io/docs/lifecycle-eth-validator.
      - name: net_fee_payout_address
        in: query
        schema:
          type: string
        required: false
        example: '0xE40F80618324C814cD444434670a44ba4583aE38'
        description: The ETH wallet address that receives the net execution layer
          rewards (when they go through a fee splitting smart contract).
      - name: staking_request_id
        in: query
        schema:
          type: string
        required: false
        example: f8bd4623-39ed-46ec-8518-991792665e56
        description: The ID associated to the request for a set of valdiators.
      - name: credentials_prefix
        in: query
        schema:
          type: string
          enum:
          - '0x01'
          - '0x02'
        required: false
        example: '0x02'
        description: Filter for withdrawal_credentials field
      - name: include_fields
        in: query
        required: false
        style: form
        explode: false
        schema:
          type: array
          description: A comma-separated list of additional objects to include in
            the response.
          items:
            type: string
            enum:
            - deposit_data
            - status_history
            - status_estimates
            - on_demand_exit
            - exit_message
            - staking_request
            - balances
          example:
          - deposit_data
          - status_history
          - status_estimates
          - on_demand_exit
          - exit_message
          - staking_request
          - balances
      - name: page
        in: query
        required: false
        style: deepObject
        schema:
          type: object
          properties:
            number:
              type: integer
              example: 2
              minimum: 1
              description: The page number.
            size:
              type: integer
              example: 10
              minimum: 1
              maximum: 100
              description: Number of items to include in the response.
      responses:
        '200':
          description: Validators list
          content:
            application/json:
              schema:
                type: object
                properties:
