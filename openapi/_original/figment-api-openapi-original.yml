                  type: string
                  example: XW5uYizJd7wQBtVv6dGXFb5emxp8Vh5Vhxqtq9cNsKc
                  description: Destination stake account pubkey
                funding_account_pubkey:
                  type: string
                  example: 77Q11RZr3an6xwPs2gEXkpz2CeZ8bsCmYs9VYviAU6jf
                  description: Pubkey of the account that will fund the transaction.
                    Defaults to the stake authority of the source stake account.
                nonce_account:
                  type: string
                  example: your-nonce-account-pubkey
                  nullable: true
                  description: Pubkey of the on-chain nonce account. Enables offline
                    signing without the 60–90s blockhash expiry.
                nonce_authority:
                  type: string
                  example: your-nonce-authority-pubkey
                  nullable: true
                  description: Pubkey of the account authorized to advance the nonce.
                    Defaults to the fee payer if omitted.
              required:
              - network
              - source_stake_account
              - destination_stake_account
