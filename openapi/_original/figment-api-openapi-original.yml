      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                time_rollup:
                  type: string
                  enum:
                  - epoch
                  - daily
                  - all_time
                  description: The granularity of the rewards data. Use `epoch` for
                    one record per validator per epoch, `daily` for rewards aggregated
                    by UTC calendar day, or `all_time` for cumulative rewards since
                    validator activation.
                  example: daily
                start:
                  type: string
                  example: '2023-07-31'
                  description: 'Lower bound of rewards data. For `epoch` time_rollup:
                    accepts an epoch number as an integer (e.g. 261702) or a date
                    string ("YYYY-MM-DD"). For `daily` time_rollup: accepts a date
                    string ("YYYY-MM-DD"). Ignored for `all_time` time_rollup.'
                end:
                  type: string
                  example: '2023-07-31'
                  description: 'Upper bound of rewards data. For `epoch` time_rollup:
                    accepts an epoch number as an integer (e.g. 261703) or a date
                    string ("YYYY-MM-DD"). For `daily` time_rollup: accepts a date
                    string ("YYYY-MM-DD"). Ignored for `all_time` time_rollup.'
                groups:
                  type: string
                  description: Filter using comma-separated group uuids.
                  example: be982d21-ff93-4092-b56a-f40bac865400,a0ba2333-c541-41f0-ad89-e29a268a3ee5
                network:
                  type: string
                  default: mainnet
                  enum:
                  - mainnet
                  - hoodi
                pubkeys:
                  type: array
                  description: A list of validator pubkeys for filtering.
                  items:
                    type: string
                    example: '0x9a0059ed6c2d2e35104a5113fdefa9d06cbd855b7be170f068b100391ffc811f55af4933e5e832a6c4ccfa69e7e4d120'
                withdrawal_addresses:
                  type: array
                  description: A list of withdrawal addresses or credentials for filtering.
                  items:
                    type: string
                    example: '0x010000000000000000000000ed488e6cc4b030eb5bfdde3227c3d5da2b9040e8'
                page:
                  type: object
                  properties:
                    size:
                      type: integer
                      example: 500
                      description: Max number of entries to return. Only available
                        when time_rollup is "all_time".
                    number:
                      type: integer
                      example: 1
                      description: page number of result set. Only available when
                        time_rollup is "all_time"
                include_penalties:
                  type: boolean
                  default: false
                  description: |-
                    When `true`, includes a separate `consensus_penalty` entry in the rewards array representing attestation and sync committee penalties for the period. Defaults to `false`.
                    **Data availability:** Penalty data is available from epoch **427295** (2026-02-12) onward. For periods before this epoch/date, no `consensus_penalty` entry will be present in the response regardless of whether penalties were incurred. For `all_time` rollups, the penalty represents the sum from epoch 427295 (2026-02-12) to present, not the validator's full lifetime.
              required:
              - time_rollup
              - start
              - end
  "/ethereum/withdrawals":
    post:
      summary: Withdrawals
      operationId: eth-withdrawals
      tags:
      - Ethereum
      parameters: []
      responses:
        '200':
          description: List of validator withdrawals.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        index:
                          type: integer
                          example: 7642977
                          description: The unique index of the withdrawal on chain
                            (from round robin process).
                        pubkey:
                          type: string
                          example: '0x9999e34d7049e81fb48cefdfa0e671b920ea1a1a292c3596041da2698a9ed303b802806c5ffd49498413c4b97748239f'
                          description: The public key of the validator.
                        validator_index:
                          type: integer
                          example: 626955
                          description: The index of the validator.
                        withdrawal_address:
                          type: string
                          example: '0xe187d594402c8f6b147f22d443406d1b1edebdc7'
                          description: The withdrawal address of the validator.
                        amount_text:
                          type: string
                          example: '32'
                          description: The withdrawal amount (as text).
                        currency:
                          type: string
                          example: ETH
                        amount_numeric:
                          type: integer
                          example: 32000000000000000000
                          description: The withdrawal amount (as an integer) - needs
                            exp below.
                        exp:
                          type: integer
                          example: 18
                          description: The exponent used to calculate the final ETH
                            amount.
                        full_withdrawal:
                          type: boolean
                          example: true
                          description: Whether the validator exited or not.
                        slot:
                          type: integer
                          example: 6694928
                          description: The consensus layer slot at which the withdrawal
                            occurred.
                        block_number:
                          type: integer
                          example: 17512592
                          description: The execution layer block at which the withdrawal
                            occurred.
                        epoch:
                          type: integer
                          example: 209216
                          description: The epoch in which the withdrawal sweep happened.
                        timestamp:
                          type: string
                          example: '2023-06-19T08:25:36Z'
                          description: The timestamp of the end of the epoch.
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        example: ethereum
                        description: The name of the protocol queried.
                      network:
                        type: string
                        enum:
                        - mainnet
                        - hoodi
                        example: mainnet
                        description: Name of the network on which rewards were earned.
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start:
                  type: string
                  example: '2023-06-19'
                  description: Lower bound of withdrawal data expressed as epoch number
                    (for epoch rollup only) or timestamps (as strings "YYYY-MM-DD").
                    This parameter is ignored when all_time rollup is requested.
                end:
                  type: string
                  example: '2023-07-19'
                  description: Upper bound of withdrawal data expressed as epoch number
                    (for epoch rollup only) or timestamps (as strings "YYYY-MM-DD").
                    This parameter is ignored when all_time rollup is requested.
                network:
                  type: string
                  nullable: true
                  default: mainnet
                  enum:
                  - mainnet
                  - hoodi
                withdrawal_addresses:
                  type: array
                  description: A set of withdrawal addresses (or withdrawal credentials)
                    to include in the results.
                  nullable: true
                  items:
                    type: string
                    example: '0xe187d594402c8f6b147f22d443406d1b1edebdc7'
                pubkeys:
                  type: array
                  description: A set of validator public keys to include in the results.
                  nullable: true
                  items:
                    type: string
                    example: '0x9999e34d7049e81fb48cefdfa0e671b920ea1a1a292c3596041da2698a9ed303b802806c5ffd49498413c4b97748239f'
              required:
              - start
              - end
  "/ethereum/validators/exits":
