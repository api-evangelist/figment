                        epoch:
                          type: string
                          description: The epoch number. Only available on epoch time_rollup
                        timestamp:
                          type: string
                          description: The timestamp at the end of the epoch.
                        rewards:
                          type: array
                          items:
                            type: object
                            description: The formula to compute the final rewards
                              in the currency unit is numeric x 10^(-exp).
                            properties:
                              text:
                                type: string
                                description: The textual version of the other fields
                                  in the rewards object.
                              currency:
                                type: string
                              numeric:
                                type: integer
                              exp:
                                type: integer
                              type:
                                type: string
                                description: The type of reward. Either "mev" or "protocol"
                        balances:
                          type: array
                          items:
                            type: object
                            description: The account's current balance.
                            properties:
                              text:
                                type: string
                                description: The textual version of the other fields
                                  in the rewards object.
                              currency:
                                type: string
                              numeric:
                                type: integer
                              exp:
                                type: integer
                  meta:
                    type: object
                    properties:
                      protocol:
                        type: string
                        description: The name of the protocol queried.
                      network:
                        type: string
                        description: The name of the network queried.
                      time_rollup:
                        type: string
                        description: The unit of the rollup.
              example:
                data:
                - stake_account: 2yoofMr4N78WPxVK8MU8Yy26dfRZbPw5WDzTRCA9uv95
                  rewards:
                  - text: '0.001390828'
                    currency: SOL
                    numeric: 1390828
                    exp: 9
                    type: protocol
                  - text: '0.000220507'
                    currency: SOL
                    numeric: 220507
                    exp: 9
                    type: mev
                  balances:
                  - text: '3.340325069'
                    currency: SOL
                    numeric: 3340325069
                    exp: 9
                  epoch: 584
                  timestamp: '2024-03-07T18:42:36Z'
                  validator: CcaHc2L43ZWjwCHART3oZoJvHLAe9hzT2DJNUpBzoTN1
                  stake_authority: EToJFrGakntRnwL8LLikLgXoAfBjgwYhwwYvfVRcrgLL
                  withdraw_authority: EToJFrGakntRnwL8LLikLgXoAfBjgwYhwwYvfVRcrgLL
                meta:
                  protocol: solana
                  network: mainnet
                  time_rollup: epoch
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - "$ref": "#/components/schemas/sol_rewards_req_by_stake_account"
              - "$ref": "#/components/schemas/sol_rewards_req_by_stake_authority"
              - "$ref": "#/components/schemas/sol_rewards_req_by_withdraw_authority"
              - "$ref": "#/components/schemas/sol_rewards_req_by_groups"
  "/solana/rewards_rates":
    get:
      tags:
      - Solana
      summary: Reward Rates
      operationId: sol-rewards-rates
      parameters:
      - in: query
        name: figment
        schema:
          type: boolean
          default: false
        required: false
        description: If `true`, for [our main public validator](https://www.validators.app/validators/Fd7btgySsrjuo25CJCj7oE7VPMyezDhnx7pZkj2v69Nk)
          only. Otherwise, for the whole network.
      - in: query
        name: avg
        schema:
          type: string
          enum:
          - 7d
          default: 7d
        required: false
        description: If `7d`, returns the 7 days moving average. If not, returns the
          daily spot rates.
      - in: query
        name: decimal
        schema:
          type: integer
          default: 2
        required: false
        description: Specifies the number of desired decimal to be returned. Accepts
          values between 2 (default) and 5.
      responses:
        '200':
          description: List of rewards rates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: '2023-07-05'
                          description: Specific date associated with value (staking
                            reward rates).
                        value:
                          type: string
                          example: '10.37'
                          description: Staking reward rates, in %.
                        protocol:
                          type: string
                          example: '6.81'
                          description: Protocol (inflationary) portion of the staking
                            reward rates, in %.
                        mev:
                          type: string
                          example: '2.91'
                          description: Mev portion of the staking reward rates, in
                            %.
              example:
                data:
                - date: '2024-11-26'
                  value: '10.37'
                  protocol: '6.81'
                  mev: '2.91'
                - date: '2024-11-25'
                  value: '10.37'
                  protocol: '6.81'
                  mev: '2.91'
                - date: '2024-11-24'
                  value: '10.60'
                  protocol: '6.82'
                  mev: '3.78'
                - date: '2024-11-23'
                  value: '11.71'
                  protocol: '6.87'
                  mev: '4.84'
                - date: '2024-11-21'
                  value: '11.93'
                  protocol: '6.78'
                  mev: '4.65'
        '400':
          description: Parameter error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
        '500':
          description: System error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/rewards_error"
  "/solana/allocated_rewards":
    post:
      summary: Allocated Rewards
      tags:
      - Solana
      operationId: solana-allocated-rewards
      parameters: []
      responses:
        '200':
          description: Success
          content:
            application/x-ndjson:
              schema:
                type: object
                properties:
                  stake_account:
                    type: string
                    example: HsHmF24mA182PgXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  stake_authority:
                    type: string
                    example: AQbak1dRySjKfSXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  withdraw_authority:
                    type: string
                    nullable: true
                    example: AQbak1dRySjKfSXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  validator:
                    type: string
                    example: GvZEwtCHZ7YtXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
                  epoch:
                    type: integer
                    example: 581
                  timestamp:
                    type: string
                    format: date-time
                    example: '2024-03-01T14:58:33Z'
                  rewards:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - protocol
                          - mev
                          - priority_fees
                          example: protocol
                        numeric:
                          type: string
                          nullable: true
                          example: '1234567890'
                        exp:
                          type: integer
                          example: 9
                        currency:
                          type: string
                          example: SOL
                      required:
                      - type
                      - exp
                      - currency
                required:
                - stake_account
                - stake_authority
                - epoch
                - timestamp
                - rewards
        '401':
          description: Invalid API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum:
                  - mainnet
                  example: mainnet
                  description: Network to query. Only mainnet is supported.
                start:
                  type:
                  - string
                  - integer
                  example: 581
                  description: 'Start of the range. Either an epoch (integer) or a
                    date (YYYY-MM-DD). Maximum range: 90 days or 45 epochs.'
                end:
                  type:
                  - string
                  - integer
                  example: 590
                  description: 'End of the range. Must be the same type as start.
                    Maximum range: 90 days or 45 epochs.'
                stake_accounts:
                  type: array
                  items:
                    type: string
                  example:
                  - HsHmF24mA182Pg...
                  description: Filter results to specific stake account addresses.
                stake_authorities:
                  type: array
                  items:
                    type: string
                  example:
                  - AQbak1dRySjKfS...
                  description: Filter results to specific stake authority addresses.
                withdraw_authorities:
                  type: array
                  items:
                    type: string
                  example:
                  - AQbak1dRySjKfS...
                  description: Filter results to specific withdraw authority addresses.
              required:
              - network
              - start
              - end
