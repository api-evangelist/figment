  "/validators":
    get:
      summary: List validators visible to the calling organization
      tags:
      - Validators
      operationId: list-validators
      parameters:
      - name: page[number]
        in: query
        required: false
        description: Page number, starting at 1.
        example: 1
        schema:
          type: integer
      - name: page[size]
        in: query
        required: false
        description: Number of items per page.
        example: 100
        schema:
          type: integer
      - name: protocol
        in: query
        required: false
        description: Filter results to a single protocol (e.g. `solana`, `near`).
          Returns 400 if the protocol is unknown.
        example: solana
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        protocol:
                          type: string
                          example: solana
                          description: Protocol the validator runs on.
                        network:
                          type: string
                          example: mainnet
                          description: Network within the protocol.
                        address:
                          type: string
                          example: CcaHc2L43ZWjwCHART3oZoJvHLAe9hzT2DJNUpBzoTN1
                          description: Canonical public identifier for the validator
                            on this protocol.
                        type:
                          type: string
                          example: solana_vote
                          description: Identifier type for the address (e.g. solana_vote,
                            operator, validator, finality_provider).
                  meta:
                    type: object
                    properties:
                      pagination:
                        type: object
                        properties:
                          current_page:
                            type: integer
                            example: 1
                          total_pages:
                            type: integer
                            example: 10
                          total_item_count:
                            type: integer
                            example: 1000
                          has_next:
                            type: boolean
                            example: true
        '400':
          description: Unknown protocol filter value
        '404':
          description: Endpoint hidden when feature flag is disabled
        '401':
          description: Invalid API key
  "/avalanche/broadcast":
    post:
      summary: Broadcasts
      tags:
      - Avalanche
      operationId: broadcast-avalanche-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      transaction_hash:
                        type: string
                        example: 0xTransactionHash
                        description: Transaction Hash of the broadcasted transaction
                example:
                  type: object
                  properties:
                    network:
                      type: string
                      example: hoodi
                      enum:
                      - mainnet
                      - hoodi
                      description: Network name
                    transaction_hash:
                      type: string
                      example: '0xae96cb28f012f20a63118cf34f60de63c9884a483cc742d5f41a1aee6f5cd5f3'
                      description: The transaction hash from the onchain broadcast.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: fuji
                  enum:
                  - fuji
                  - mainnet
                  description: Avalanche network to build transaction for, mainnet
                    or fuji
                signed_payload:
                  type: string
                  example: 0xSignedPayload
                  description: Signature from signing the signing_payload
                unsigned_transaction_serialized:
                  type: string
                  example: 0xSerializedTransaction
                  description: unsigned_transaction_serialized from the tx response
              required:
              - network
              - signed_payload
              - unsigned_transaction_serialized
  "/avalanche/delegate":
    post:
      summary: Delegate
      tags:
      - Avalanche
      operationId: build-avalanche-delegate-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: fuji
                        description: Avalanche network to build transaction for, mainnet
