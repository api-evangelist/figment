                      daily_rewards_usd: '10.4'
                    - date: '2024-08-16T00:00:00Z'
                      sum_rewards: '0.014103402730016545'
                      daily_rewards: '0.001973320632072101'
                      daily_rewards_eur: '4.71'
                      daily_rewards_gbp: '4.02'
                      daily_rewards_usd: '5.17'
        '401':
          description: Invalid API key
  /vaults/{vault_address}/commission/{commission_address}/actions:
    get:
      summary: Commission Actions
      tags:
      - Vaults
      operationId: show-commission-actions
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
          description: Address of the Vault
        required: true
      - name: commission_address
        in: path
        schema:
          type: string
          description: Address of the commission
        required: true
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      - name: limit
        in: query
        schema:
          type: integer
          description: Limit for Staker Actions
        example: '10'
        required: false
      - name: offset
        in: query
        schema:
          type: integer
          description: Offset for Staker Actions
        example: '1'
        required: false
      responses:
        '200':
          description: Commission Actions
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/stake_wise_shareholder_actions'
                example:
                  data:
                    actions:
                    - id: 0x9b516fb296aa5170419316efd6c15c561b1f8dc75c6b62d1be4750b759f09740-2
                      assets: '0.000000999999999999'
                      shares: '0.0'
                      created_at: '2024-08-15T14:21:36Z'
                      action_type: ExitedAssetsClaimed
                      link: https://hoodi.etherscan.io/tx/0x8535d751c6c020e6eae637746ef16d1c8703e6d295b24bf3e317aa67ec12957e
        '401':
          description: Invalid API key
  /vaults/{vault_address}/commission/{commission_address}/balance:
    get:
      summary: Commission Balance
      tags:
      - Vaults
      operationId: show-commission-balance
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
          description: Address of the Vault
        required: true
      - name: commission_address
        in: path
        schema:
          type: string
          description: Address of the commision
        required: true
      - name: network
        in: query
        schema:
          type: string
          enum:
          - mainnet
          - hoodi
        example: hoodi
        required: true
      responses:
        '200':
          description: Commission Balance
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/stake_wise_shareholder_balance'
                example:
                  data:
                    balance: '0.000216504418283007'
        '401':
          description: Invalid API key
  /vaults/{vault_address}/transactions/withdraw_commission:
    post:
      summary: Withdraw commission
      tags:
      - Vaults
      operationId: create-withdraw-commission-transactions
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
          description: Address of the Vault
        required: true
      responses:
        '200':
          description: Transaction payload to withdraw comission.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/ethereum_transaction'
                example:
                  data:
                    unsigned_transaction_serialized: ''
                    unsigned_transaction_hash: '0x7de4a33e6cb731239cbf58c915b666cb9680cf14cc2d144d0bad5d7140c84fa7'
                    max_transaction_cost: 3999034319785598
                    calldata: ''
        '400':
          description: Bad Request
        '401':
          description: Invalid API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: hoodi
                  enum:
                  - mainnet
                  - hoodi
                  description: Network name
                from_address:
                  type: string
                  example: '0xa067dace6d518235489d9dcee8d9879703fd99f24'
                  description: Address of the signer
                receiver_address:
                  type: string
                  example: '0xa067dace6d518235489d9dcee8d9879703fd99f24'
                  description: Address of the receiver
                amount:
                  type: string
                  pattern: ^\d+(\.\d+)?$
                  example: '10.0'
                  description: Amount of ETH to withdraw
              required:
              - network
              - from_address
              - receiver_address
              - amount
        required: true
  /vaults/{vault_address}/information/assets_to_shares:
    post:
      summary: Assets to Shares
      tags:
      - Vaults
      operationId: assets-to-shares
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
          description: Address of the Vault
        required: true
      responses:
        '200':
          description: Amount of assets converted to shares
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/stake_wise_assets_to_shares'
                example:
                  data:
                    shares: '100148521403922573'
        '401':
          description: Invalid API key
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: hoodi
                  enum:
                  - mainnet
                  - hoodi
                  description: Network name
                assets:
                  type: string
                  example: '0.3'
                  description: Amount of ETH to convert to shares
              required:
              - network
              - assets
        required: true
  /vaults/{vault_address}/information/shares_to_assets:
    post:
      summary: Shares to Assets
      tags:
      - Vaults
      operationId: shares-to-assets
      parameters:
      - name: vault_address
        in: path
        schema:
          type: string
          description: Address of the Vault
        required: true
      responses:
        '200':
          description: Amount of shares converted to assets
          content:
            application/json:
              schema:
