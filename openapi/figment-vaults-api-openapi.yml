components:
  schemas:
    stake_wise_shares_to_assets:
      type: object
      properties:
        assets:
          type: string
          example: '0.1'
          description: Amount of shares to convert to assets
    ethereum_transaction:
      type: object
      properties:
        unsigned_transaction_serialized:
          type: string
          example: ''
          description: The unsigned transaction payload serialized in hex format
        unsigned_transaction_hash:
          type: string
          example: '0x7de4a33e6cb731239cbf58c915b666cb9680cf14cc2d144d0bad5d7140c84fa7'
          description: keccak256 hash of the serialized unsigned transaction payload
        max_transaction_cost:
          type: integer
          example: 3999034319785598
          description: Max transaction cost in gwei
        calldata:
          type: string
          example: ''
          description: Calldata for the transaction.
    pagination:
      type: object
      properties:
        pagination:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            total_pages:
              type: integer
              example: 10
            total_item_count:
              type: integer
              example: 1000
            has_next:
              type: boolean
              example: true
    stake_wise_shareholder_exit_requests:
      type: object
      properties:
        exit_requests:
          type: array
          items:
            type: object
            properties:
              position_ticket:
                type: string
                example: '1011053000346910311'
                description: Represents your position in the queue and is calculated based on the queue length and amount of ETH you want to exit
              owner:
                type: string
                example: '0x924927cfd967488ef317fc7a96c71907795c8538'
                description: The commission_address that initiated the exit request
              receiver:
                type: string
                example: '0x924927cfd967488ef317fc7a96c71907795c8538'
                description: The address that will receive the assets from the exit request after calling the Claim Withdrawal endpoint
              timestamp:
                type: string
                example: '2024-08-14T00:00:00Z'
                description: A unix timestamp of when the exit request occurred
              total_assets:
                type: string
                example: '0.000000999999999999'
                description: Total amount requested to be exited
              exited_assets:
                type: string
                example: '0.000000999999999999'
                description: Amount exited in the current exit request. When the total amount of assets isn’t fully unbonded, a new exit request for the customer will be created that will exit the remainder exited_assets
              claimable:
                type: boolean
                example: true
                description: If the exit request is claimable
              claimed:
                type: boolean
                example: false
                description: If the exit request has been claimed
              withdrawal_timestamp:
                type: string
                example: '2024-08-14T00:00:00Z'
                description: An estimate unix timestamp of when the receiver address can claim the exit request. This value is ‘0’ if it is passed the time to claim and ‘null’ initially while calculating the withdrawal time estimate
    stake_wise_shareholder_balance:
      type: object
      properties:
        balance:
          type: string
          example: '0.000426071736079811'
          description: Balance in ETH
    stake_wise_shareholder_actions:
      type: object
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 0x8535d751c6c020e6eae637746ef16d1c8703e6d295b24bf3e317aa67ec12957e-7
              assets:
                type: string
                example: '0.000000999999999999'
              shares:
                type: string
                example: '0.0'
              created_at:
                type: timestamp
                example: 1723764672000
              action_type:
                type: string
                example: ExitedAssetsClaimed
              link:
                type: string
                example: https://hoodi.etherscan.io/tx/0x8535d751c6c020e6eae637746ef16d1c8703e6d295b24bf3e317aa67ec12957e
    stake_wise_depositor_balance:
      type: object
      properties:
        balance:
          type: string
          example: '0.2'
          description: Balance in ETH
    vault:
      type: object
      properties:
        id:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: A unique UUID for the vault.
        network:
          type: string
          example: hoodi
          enum:
          - mainnet
          - hoodi
        address:
          type: string
          example: '0xE40F80618324C814cD444434670a44ba4583aE38'
        fee_recipient_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
          description: The fee recipient address that receives Execution Layer fees. For Figment-operated validators only.
        region:
          type: string
          nullable: true
          example: ca-central-1
          description: The geographic region in which the validator operates. For Figment-operated validators only.
        vault_admin_id:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: A unique UUID for the vault admin id.
        vault_admin_address:
          type: string
          nullable: true
          example: '0x781462762B706AA7c1DA71FBA1a545724928b81f'
        validators_manager_address:
          type: string
          example: 031af36c-508a-4f3d-84dd-f46d9e59428f
          description: The validator manager address
        fee_bps:
          type: integer
          example: 500
        capacity_wei:
          type: integer
          example: 500
        own_mev_escrow:
          type: boolean
          example: true
        reward_splitter_contract_address:
          type: string
          example: '0xa73bacbb54faac0144fe749273a552026d0ff334'
        created_at:
          type: string
          example: '2023-07-01T00:00:00.000Z'
          description: The time at which the vault was created.
        updated_at:
          type: string
          example: '2023-07-01T00:00:00.000Z'
          description: The time at which the vault was updated.
    stake_wise_depositor_exit_requests:
      type: object
      properties:
        exit_requests:
          type: array
          items:
            type: object
            properties:
              position_ticket:
                type: string
                example: '1011053000346910311'
                description: Represents your position in the queue and is calculated based on the queue length and amount of ETH you want to exit
              owner:
                type: string
                example: '0x924927cfd967488ef317fc7a96c71907795c8538'
                description: The address that initiated the exit request
              receiver:
                type: string
                example: '0x924927cfd967488ef317fc7a96c71907795c8538'
                description: The address that will receive the assets from the exit request after calling the Claim Withdrawal endpoint
              timestamp:
                type: string
                example: '2024-08-14T00:00:00Z'
                description: A unix timestamp of when the exit request occurred
              total_assets:
                type: string
                example: '0.000000999999999999'
                description: Total amount requested to be exited
              exited_assets:
                type: string
                example: '0.000000999999999999'
                description: Amount exited in the current exit request. When the total amount of assets isn’t fully unbonded, a new exit request for the customer will be created that will exit the remainder exited_assets
              claimable:
                type: boolean
                example: true
                description: If the exit request is claimable
              claimed:
                type: boolean
                example: false
                description: If the exit request has been claimed
              withdrawal_timestamp:
                type: string
                example: '2024-08-14T00:00:00Z'
                description: An estimate unix timestamp of when the receiver address can claim the exit request. This value is ‘0’ if it is passed the time to claim and ‘null’ initially while calculating the withdrawal time estimate.
    stake_wise_assets_to_shares:
      type: object
      properties:
        shares:
          type: string
          example: '0.1'
          description: Amount of assets to convert to shares
    stake_wise_allowlist_entry:
      type: object
      properties:
        created_at:
          type: integer
          example: 1719345504000
        address:
          type: string
          example: '0xE373733544a50A5Ea8A4Aa0209d30d1Eab13fD2b'
    stake_wise_depositor_actions:
      type: object
      properties:
        actions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                example: 0x854f766c2e64b219bbfb613c59a7a506eea08e63eb38beb75a349a1b12f789ab-8
              assets:
                type: string
                example: '0.1'
              shares:
                type: string
                example: '0.1'
              created_at:
                type: timestamp
                example: 1716327696000
              action_type:
                type: string
                example: Deposited
              link:
                type: string
                example: https://hoodi.etherscan.io/tx/0x854f766c2e64b219bbfb613c59a7a506eea08e63eb38beb75a349a1b12f789ab
    stake_wise_depositor_rewards:
      type: object
      properties:
        rewards:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                example: '2024-08-14T00:00:00Z'
              sum_rewards:
                type: string
                example: '0.008092870114883128'
              daily_rewards:
                type: string
                example: '0.003493495227587289'
              daily_rewards_eur:
                type: string
                example: '8.54'
              daily_rewards_gbp:
                type: string
                example: '7.33'
              daily_rewards_usd:
                type: string
                example: '9.41'
