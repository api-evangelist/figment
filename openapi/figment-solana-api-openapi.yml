  /solana/merge:
    post:
      summary: Merge
      tags:
      - Solana
      operationId: build-solana-merge-tx
      parameters: []
      responses:
        '201':
          description: transaction created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      network:
                        type: string
                        example: devnet
                        description: Solana network to build transaction for
                        enum:
                        - mainnet
                        - testnet
                        - devnet
                      signing_payload:
                        type: string
                        example: 0xSigningPayload
                        description: Hex encoded payload to sign
                      unsigned_transaction_serialized:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoded transaction payload
                      unsigned_tx_serialized_hex:
                        type: string
                        example: 0xSerializedTransaction
                        description: Hex encoded transaction payload
                      unsigned_tx_serialized_base64:
                        type: string
                        example: 0xSerializedTransaction
                        description: Base64 encoded transaction payload
                      last_valid_block_height:
                        type: number
                        example: 359339325
                        nullable: true
                        description: Block height after which the transaction payload will be expired
                      nonce_value:
                        type: string
                        nullable: true
                        example: GNP8nFAjKFBxL6Bfmti9gBGxCRF7gMaGmEiKfJKpJAaG
                        description: The nonce value used as the transaction's blockhash. Present when nonce_account is provided.
                      is_durable_nonce:
                        type: boolean
                        nullable: true
                        description: True when a durable nonce is used. last_valid_block_height will be null.
        '422':
          description: Invalid request
        '400':
          description: Invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  example: devnet
                  description: Solana network to build transaction for
                  enum:
                  - mainnet
                  - testnet
                  - devnet
                source_stake_account:
                  type: string
                  example: 4N8VxfxDqHpsPT6w73TzV4qVjp9SGqAfLPAfJsQZCegS
                  description: Source stake account pubkey
                destination_stake_account:
                  type: string
                  example: XW5uYizJd7wQBtVv6dGXFb5emxp8Vh5Vhxqtq9cNsKc
                  description: Destination stake account pubkey
                funding_account_pubkey:
                  type: string
                  example: 77Q11RZr3an6xwPs2gEXkpz2CeZ8bsCmYs9VYviAU6jf
                  description: Pubkey of the account that will fund the transaction. Defaults to the stake authority of the source stake account.
                nonce_account:
                  type: string
                  example: your-nonce-account-pubkey
                  nullable: true
                  description: Pubkey of the on-chain nonce account. Enables offline signing without the 60–90s blockhash expiry.
                nonce_authority:
                  type: string
                  example: your-nonce-authority-pubkey
                  nullable: true
                  description: Pubkey of the account authorized to advance the nonce. Defaults to the fee payer if omitted.
              required:
              - network
              - source_stake_account
              - destination_stake_account
