aid: figment
name: Figment
description: >-
  Figment is an institutional staking infrastructure provider that runs validators and staking
  services across 40+ proof-of-stake networks for asset managers, exchanges, custodians, wallets,
  banks and protocol foundations. Its developer surface is a single REST API at api.figment.io that
  abstracts network-specific staking mechanics behind one contract: build ready-to-sign staking,
  delegation, undelegation, withdrawal, exit, compound and consolidation transactions; broadcast
  them; and read back stakes, validators, activities, balances, rewards, reward rates, statements
  and portfolio data. Coverage includes Ethereum (including Pectra 0x02 compounding validators and
  Figment Validator Vaults), Solana, Cardano, Cosmos, Osmosis, Injective, NEAR, Polkadot, Polygon,
  Avalanche, Sui, Aptos, Vaulta, OpenTrade stablecoin yield vaults, and an x402 payment facilitator.
  Figment also publishes Elements, a React component library for embeddable staking widgets, and a
  documentation MCP server for agents.
