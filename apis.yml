aid: figment
name: Figment
description: >-
  Figment is an institutional staking infrastructure provider that runs validators and staking
  services across 40+ proof-of-stake networks for asset managers, exchanges, custodians, wallets,
  banks and protocol foundations. Its developer surface is a single REST API at api.figment.io that
  abstracts network-specific staking mechanics behind one contract: build ready-to-sign staking,
  delegation, undelegation, withdrawal, exit, compound and consolidation transactions; broadcast
  them; and read back stakes, validators, activities, balances, rewards, reward rates, statements
  and portfolio data. Coverage includes Ethereum (including Pectra 0x02 compounding validators and
  Figment Validator Vaults), Solana, Cardano, Cosmos, Osmosis, Injective, NEAR, Polkadot, Polygon,
  Avalanche, Sui, Aptos, Vaulta, OpenTrade stablecoin yield vaults, and an x402 payment facilitator.
  Figment also publishes Elements, a React component library for embeddable staking widgets, and a
  documentation MCP server for agents.
image: https://www.figment.io/wp-content/uploads/2024/06/Site-Preview.jpg
url: https://raw.githubusercontent.com/api-evangelist/figment/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.23'
created: '2026-08-04'
modified: '2026-08-04'
tags:
- staking
- blockchain
- digital-assets
- proof-of-stake
- validators
- institutional-finance
- rewards-reporting
- ethereum
- solana
- web3-infrastructure
- custody
- x402
apis:
- name: Figment Documentation MCP Server
  description: >-
    Hosted Model Context Protocol server served from Figment's own documentation host at docs.figment.io/mcp,
    exposing the Figment documentation and API reference to MCP clients. The endpoint is OAuth-protected
    — RFC 9728 protected-resource metadata at /.well-known/oauth-protected-resource/mcp names https://dash.readme.com/oidc
    as the authorization server — so anonymous tools/list returns "Authorization required" and the live
    tool schemas require authenticated introspection.
  humanURL: https://docs.figment.io/mcp
  baseURL: https://docs.figment.io/mcp
  tags:
  - mcp
  - agent-native
  - documentation
  - staking
  properties:
  - type: MCPServer
    url: mcp/figment-mcp.yml
  - type: ToolCrosswalk
    url: mcp/figment-tool-crosswalk.yml
  - type: Documentation
    url: https://docs.figment.io/mcp
  - type: LLMsTxt
    url: https://docs.figment.io/llms.txt
