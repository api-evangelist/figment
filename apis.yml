- name: Figment Documentation MCP Server
  description: >-
    Hosted Model Context Protocol server served from Figment's own documentation host at
    docs.figment.io/mcp, exposing the Figment documentation and API reference to MCP clients. The
    endpoint is OAuth-protected — RFC 9728 protected-resource metadata at
    /.well-known/oauth-protected-resource/mcp names https://dash.readme.com/oidc as the authorization
    server — so anonymous tools/list returns "Authorization required" and the live tool schemas
    require authenticated introspection.
  humanURL: https://docs.figment.io/mcp
  baseURL: https://docs.figment.io/mcp
