apis:
- name: Figment API
  description: >-
    Unified REST API for institutional staking across proof-of-stake networks. Endpoints build
    ready-to-sign transactions (stake, delegate, undelegate, withdraw, exit, compound, consolidate,
    transfer, claim rewards), broadcast signed payloads, and return validators, stakes, activities,
    balances, rewards, reward rates, statements and portfolio data. Authenticated with an API key in
    the x-api-key header, scoped Read/Write or Read-Only and bound to a test or production
    environment. OpenAPI 3.1.0 is published by Figment at api.figment.io/openapi/figment-api.yaml.
  humanURL: https://docs.figment.io/reference/getting-started-1
  baseURL: https://api.figment.io
