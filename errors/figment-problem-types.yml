- status: 409
  title: Idempotency conflict
  operations_declaring: 0
  documented_only: true
  docs: https://docs.figment.io/reference/idempotency-requests
  applies_to: [create-validators, create-pectra-validators]
  causes:
  - Same X-Figment-Idempotency-Key replayed with a DIFFERENT request body (fingerprint mismatch)
  - Same key replayed while the original request is still in flight
  example_envelope: |
    {
      "error": {
        "message": "a request with this idempotency key is currently being processed",
        "details": [ ... ]
      }
    }
  remediation: >-
    On a fingerprint mismatch, generate a new UUID key for the new operation. On an in-flight
    conflict, wait briefly and retry with the same key and the same body.
  note: >-
    CONTRACT GAP — this 409 is documented on the Idempotency Requests page but is NOT declared as a
    response on create-validators or create-pectra-validators in the OpenAPI. An agent or generated
    client reading only the spec will not know to handle it.
