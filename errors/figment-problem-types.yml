gaps:
- No published error-code registry — the integer `code` in the core `error` envelope (example 1000) is undocumented.
- Four different error envelopes across one API; only the x402 one carries a request_id for support correlation.
- Errors are not RFC 9457; no `type` URI, no `instance`, no stable machine-readable problem identity.
- The documented idempotency 409 is absent from the spec.
