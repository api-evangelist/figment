  shape: '{error: {code, message, request_id}}'
  detail_fields: [code, message, request_id]
  string_code: true
  example_code: invalid_request
  correlation_id: request_id
  note: >-
    The only envelope in the API that carries a string error `code` AND a correlatable `request_id`.
    The newest surface is the best-designed one; the core staking surface would benefit from the
