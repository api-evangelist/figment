description: >-
  Error catalogue derived from every 4xx/5xx response declared in Figment's published OpenAPI 3.1.0,
  enriched with the documented idempotency conflict semantics. Figment does NOT use RFC 9457
  application/problem+json — errors are a proprietary `{error: {...}}` JSON envelope, and the shape
  of that envelope differs across four schemas depending on which product surface answers.
envelopes:
- name: error
  used_by: Core staking/transaction endpoints
  media_type: application/json
  shape: '{error: {message, details: [{param, message, code, context}]}}'
  detail_fields: [param, message, code, context]
  numeric_code: true
  example_code: 1000
  note: >-
    The richest envelope — per-parameter validation detail with an integer `code`. Figment publishes
    no registry mapping those integer codes to meanings, so a client cannot branch on them reliably.
- name: staking_api_error
  used_by: Staking Flows and some staking endpoints
