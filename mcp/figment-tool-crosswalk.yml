  serves a hosted MCP endpoint at https://docs.figment.io/mcp, but tools/list is OAuth-protected
  (HTTP 401, authorization server https://dash.readme.com/oidc) and Figment publishes no tool list in
  llms.txt or the docs, so the live tool set could not be observed. NOTHING IS INVENTED HERE: the
  crosswalk[] and mcp_only[] tables are empty because no tool names exist to map, and the full REST
  surface is recorded under rest_only[] so the divergence is captured honestly rather than papered
  over. Re-run this artifact once an authenticated tools/list is available.
