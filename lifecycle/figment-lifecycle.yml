generated: '2026-08-04'
method: searched
source: https://docs.figment.io/
description: >-
  Versioning, deprecation and operational-transparency posture for the Figment API, searched across
  the documentation, the OpenAPI, the changelog and the public status page.
versioning:
  scheme: document-version
  current: 2.0.0+1190.1
  location: OpenAPI info.version
  in_path: false
  in_header: false
  in_query: false
  docs: https://docs.figment.io/reference/getting-started-1
  note: >-
    The live API is unversioned at the request level — https://api.figment.io/<resource>, no /v2
    segment and no version header. The build-numbered info.version (2.0.0+1190.1) tells a consumer
    which build the spec came from but gives no negotiation mechanism.
  generations:
  - version: '1.0'
    docs: https://docs.figment.io/v1.0/
    status: archived-documentation
  - version: legacy DataHub / Staking API
    docs: https://docs-archive.figment.io/
    status: archived-documentation
    note: >-
      The previous documentation generation (DataHub-era Staking API, learn.figment.io guides) is
      preserved on a separate host. Figment publishes no migration guide or end-of-life date
      connecting the archived generation to the current one.
deprecation:
  policy_url: null
  policy_published: false
  sunset_header: unknown
  deprecation_header: unknown
  rfc8594: unknown
  deprecated_operations: []
  spec_deprecated_flags: 0
  note: >-
    NO deprecation policy is published, no operation in the OpenAPI carries `deprecated: true`, and
    no Sunset/Deprecation header support is documented. Changelog entries do record removals in
    practice — e.g. `address_type` was dropped from the Track endpoint and single-validator tracking
    was removed for ETH — so breaking changes DO ship without a stated notice window. This is the
    clearest operational-transparency gap; no Deprecation pointer is emitted in apis.yml because
    there is no policy to point at.
